<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>freegma 목업</title>
<style>
/* ───────────── 앱 UI 토큰 (목업에서 확정 → 개발 때 앱 UI 토큰으로 옮김) ───────────── */
:root{
  --desk:#d8dce4; --desk-2:#bfc7d6;
  --win:#ffffff; --panel:#f6f6f7; --panel-2:#ececef; --hover:rgba(0,0,0,.05); --active:rgba(0,0,0,.08);
  --border:#e3e3e7; --border-strong:#cfcfd5;
  --text:#1d1d1f; --text-2:#6b6b73; --text-3:#9d9da6;
  --accent:#6e56cf; --accent-2:#5a43b8; --accent-soft:rgba(110,86,207,.12); --on-accent:#fff;
  --canvas:#e8e8eb; --canvas-dot:rgba(0,0,0,.09);
  --danger:#d33a3a; --danger-soft:rgba(211,58,58,.1);
  --warn:#a86300; --warn-soft:rgba(232,150,20,.15);
  --ok:#1b8a4a; --ok-soft:rgba(27,138,74,.12);
  --ai:#0a8a8a; --ai-soft:rgba(10,138,138,.14);
  --code-bg:#f7f7f9; --code-k:#8b3fd1; --code-s:#1a7f37; --code-t:#c2410c; --code-c:#8a8a93;
  --shadow-win:0 30px 80px rgba(20,20,40,.28),0 0 0 .5px rgba(0,0,0,.25);
  --shadow-pop:0 12px 40px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.14);
  --menubar:rgba(255,255,255,.55);
  --radius:8px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#14151a; --desk-2:#262a36;
    --win:#1f1f22; --panel:#252528; --panel-2:#2e2e32; --hover:rgba(255,255,255,.06); --active:rgba(255,255,255,.1);
    --border:#38383d; --border-strong:#4a4a50;
    --text:#f1f1f3; --text-2:#a3a3ac; --text-3:#72727b;
    --accent:#8f7cf0; --accent-2:#a495f5; --accent-soft:rgba(143,124,240,.18); --on-accent:#fff;
    --canvas:#18181b; --canvas-dot:rgba(255,255,255,.07);
    --danger:#f06a6a; --danger-soft:rgba(240,106,106,.14);
    --warn:#f0a83c; --warn-soft:rgba(240,168,60,.16);
    --ok:#4cc38a; --ok-soft:rgba(76,195,138,.14);
    --ai:#3cc6c6; --ai-soft:rgba(60,198,198,.16);
    --code-bg:#1a1a1d; --code-k:#c39bf5; --code-s:#7ee2a0; --code-t:#f5a46b; --code-c:#7a7a83;
    --shadow-win:0 30px 80px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.12);
    --shadow-pop:0 12px 40px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.12);
    --menubar:rgba(30,30,34,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#14151a; --desk-2:#262a36;
  --win:#1f1f22; --panel:#252528; --panel-2:#2e2e32; --hover:rgba(255,255,255,.06); --active:rgba(255,255,255,.1);
  --border:#38383d; --border-strong:#4a4a50;
  --text:#f1f1f3; --text-2:#a3a3ac; --text-3:#72727b;
  --accent:#8f7cf0; --accent-2:#a495f5; --accent-soft:rgba(143,124,240,.18); --on-accent:#fff;
  --canvas:#18181b; --canvas-dot:rgba(255,255,255,.07);
  --danger:#f06a6a; --danger-soft:rgba(240,106,106,.14);
  --warn:#f0a83c; --warn-soft:rgba(240,168,60,.16);
  --ok:#4cc38a; --ok-soft:rgba(76,195,138,.14);
  --ai:#3cc6c6; --ai-soft:rgba(60,198,198,.16);
  --code-bg:#1a1a1d; --code-k:#c39bf5; --code-s:#7ee2a0; --code-t:#f5a46b; --code-c:#7a7a83;
  --shadow-win:0 30px 80px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.12);
  --shadow-pop:0 12px 40px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.12);
  --menubar:rgba(30,30,34,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--text);
  font:13px/1.4 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI",sans-serif;
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace}

/* ───────────── 목업 탐색 막대 (앱 밖) ───────────── */
#mocknav{flex:none;display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--win);
  border-bottom:1px solid var(--border);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
#mocknav .tag{font-weight:700;margin-right:8px;display:flex;align-items:center;gap:6px}
#mocknav .tag small{font-weight:500;color:var(--text-2);font-size:11px;background:var(--panel-2);padding:2px 6px;border-radius:4px}
#mocknav .sep{width:1px;height:20px;background:var(--border);margin:0 6px;flex:none}
#mocknav .nb{border:1px solid var(--border);background:var(--panel);border-radius:6px;padding:4px 10px;font-size:12px}
#mocknav .nb:hover{background:var(--panel-2)}
#mocknav .nb.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
#mocknav label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-2);padding:0 4px;cursor:pointer}
#mocknav select{border:1px solid var(--border);background:var(--panel);border-radius:6px;padding:3px 6px;font-size:12px}

/* ───────────── 바탕화면 + 메뉴 막대 ───────────── */
#stage{flex:1;min-height:0;overflow:auto;padding:8px;display:flex;flex-direction:column;
  background:radial-gradient(1200px 600px at 20% 0%,var(--desk-2),transparent 60%),var(--desk)}
.menubar{display:none;align-items:center;gap:20px;height:26px;margin:0 -16px 18px;padding:0 16px;
  background:var(--menubar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:13px}
.menubar b{font-weight:700}
.menubar .r{margin-left:auto;color:var(--text-2)}
.window{position:relative;margin:0 auto;width:100%;min-width:1100px;
  flex:1;min-height:640px;background:var(--win);border-radius:12px;box-shadow:var(--shadow-win);
  overflow:hidden;display:flex;flex-direction:column}
.screen{display:none;flex:1;min-height:0}
.screen.on{display:flex}
.lights{display:flex;gap:8px;flex:none}
.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}

/* 공통 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 12px;border-radius:6px;
  border:1px solid var(--border-strong);background:var(--win);font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2)}
.btn.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.btn.small{height:24px;padding:0 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{background:var(--win)}
.btn.primary:disabled:hover{background:var(--accent)}
.icon{width:16px;height:16px;flex:none;display:inline-block;vertical-align:middle}
.kbd{font-size:11px;color:var(--text-3);margin-left:auto}

/* ───────────── 시작 화면 ───────────── */
#screen-start{flex-direction:column}
.titlebar{height:40px;flex:none;display:flex;align-items:center;padding:0 14px;position:relative;border-bottom:1px solid var(--border);background:var(--panel)}
.titlebar .t{position:absolute;left:0;right:0;text-align:center;font-weight:600;color:var(--text-2);pointer-events:none}
.start{flex:1;display:grid;grid-template-columns:340px 1fr;min-height:0}
.start-l{padding:48px 36px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:28px;background:var(--panel)}
.brand{display:flex;align-items:center;gap:14px}
.brand h1{margin:0;font-size:26px;letter-spacing:-.02em}
.brand p{margin:2px 0 0;color:var(--text-2);font-size:12px}
.start-actions{display:flex;flex-direction:column;gap:8px}
.start-actions .btn{height:40px;justify-content:flex-start;padding:0 14px;font-size:14px}
.start-note{margin-top:auto;font-size:12px;color:var(--text-2);line-height:1.6}
.start-note b{color:var(--text)}
.start-r{padding:40px 44px;overflow:auto;display:flex;flex-direction:column;gap:20px}
.start-r h2{font-size:13px;color:var(--text-2);font-weight:600;margin:0}
.recent{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.recent button{display:grid;grid-template-columns:36px 1fr 120px 90px 80px;align-items:center;gap:12px;width:100%;
  padding:12px 16px;border:0;border-bottom:1px solid var(--border);background:var(--win);text-align:left}
.recent button:last-child{border-bottom:0}
.recent button:hover{background:var(--hover)}
.recent .pi{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.recent .nm{font-weight:600}.recent .pt{color:var(--text-2);font-size:12px}
.recent .meta{color:var(--text-2);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:999px;font-size:11px;background:var(--panel-2);color:var(--text-2);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.folder-card{border:1px solid var(--border);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.folder-card .path{font-weight:600}
.step{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13px}
.step.warn{background:var(--warn-soft);color:var(--warn)}
.step.ok{background:var(--ok-soft);color:var(--ok)}
.step.info{background:var(--accent-soft);color:var(--accent)}
.step .sp{flex:1}
.step .btn{color:var(--text)}

/* ───────────── 편집 화면 ───────────── */
.editor{position:relative;flex:1;display:grid;grid-template-columns:248px minmax(0,1fr) var(--rp,340px);grid-template-rows:44px minmax(0,1fr);min-height:0}
.rp-drag{position:absolute;top:44px;bottom:0;right:calc(var(--rp,340px) - 3px);width:6px;cursor:col-resize;z-index:6}
.rp-drag:hover,.rp-drag.on{background:var(--accent);opacity:.5}
.hdr{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 12px 0 14px;background:var(--panel);border-bottom:1px solid var(--border)}
.hdr .proj{display:flex;align-items:center;gap:8px;margin-left:10px;font-weight:600}
.hdr .branch{display:inline-flex;align-items:center;gap:4px;color:var(--text-2);font-weight:500;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--panel-2)}
.hdr .branch.nogit{color:var(--warn);background:var(--warn-soft)}
.hdr .branch:not(.nogit){cursor:pointer}
.hdr .branch:not(.nogit):hover{background:var(--active);color:var(--text)}
.hdr .branch .car{font-size:9px;opacity:.7}
.pop .pi:disabled{opacity:.45;cursor:not-allowed}
.pop .pi:disabled:hover{background:transparent;color:inherit}
.pop .pi .ck{width:12px;flex:none;color:var(--accent);font-weight:700}
.pop .pi:hover .ck{color:inherit}
.pop .br-cur{font-weight:600;cursor:default}
.pop .pi.br-cur:hover{background:transparent;color:inherit}
.pop .br-sep{height:1px;background:var(--border);margin:4px 6px}
.br-note{padding:6px 10px 4px;font-size:11px;color:var(--text-2);line-height:1.6;max-width:300px}
.br-note.warn{color:var(--warn)}
.seg{display:flex;padding:2px;border-radius:8px;background:var(--panel-2);margin:0 auto}
.seg button{border:0;background:transparent;padding:4px 14px;border-radius:6px;font-size:12px;font-weight:500;color:var(--text-2)}
.seg button.on{background:var(--win);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.changes{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--text-2);font-size:12px;padding:4px 8px;border-radius:6px}
.changes:hover{background:var(--hover)}
.changes .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.changes.zero .dot{background:var(--text-3)}

.left{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px;font-size:11px;font-weight:600;color:var(--text-2)}
.sec-h .btn{height:20px;width:20px;padding:0}
.pages{padding:0 6px 8px;border-bottom:1px solid var(--border)}
.pages button,.layers .row{display:flex;align-items:center;gap:6px;width:100%;border:0;background:transparent;text-align:left;
  padding:4px 8px;border-radius:5px;font-size:12px;color:var(--text)}
.pages button:hover,.layers .row:hover{background:var(--hover)}
.pages button.on{background:var(--active);font-weight:600}
.tabs{display:flex;gap:2px;padding:6px 8px;border-bottom:1px solid var(--border)}
.tabs button{flex:1;border:0;background:transparent;padding:4px 0;border-radius:5px;font-size:12px;color:var(--text-2)}
.tabs button.on{background:var(--active);color:var(--text);font-weight:600}
.left-body{flex:1;overflow:auto;padding:6px}
.layers .row{padding-top:3px;padding-bottom:3px;cursor:default}
.layers .row.sel{background:var(--accent-soft);color:var(--accent)}
.layers .aim{margin-left:auto;color:var(--ai);font-size:11px;flex:none}
.layers .tw{width:12px;height:12px;flex:none;color:var(--text-3);display:grid;place-items:center;cursor:pointer}
.layers .tw svg{width:8px;height:8px;transition:transform .12s}
.layers .tw.col svg{transform:rotate(-90deg)}
.layers .ic{width:14px;flex:none;color:var(--text-3);font-size:11px;text-align:center}
.layers .row.sel .ic{color:var(--accent)}
.layers .row.inst .ic{color:var(--accent)}
.layers .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layers .row.frame-row{font-weight:600}
.comp{border:1px solid var(--border);border-radius:8px;background:var(--win);margin:6px 2px;overflow:hidden}
.comp .pv{height:76px;display:grid;place-items:center;background:var(--canvas);padding:10px;overflow:hidden}
.comp .cb{padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.comp .cn{font-weight:600;font-size:12px;display:flex;align-items:center;gap:6px}
.comp .cl{font-size:11px;color:var(--text-2)}
.tok-g{font-size:11px;font-weight:600;color:var(--text-2);margin:10px 6px 4px}
.tok{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:5px;font-size:12px}
.tok:hover{background:var(--hover)}
.tok .sw{width:16px;height:16px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);flex:none}
.tok .v{margin-left:auto;color:var(--text-2);font-size:11px}
.tok .bar{height:6px;background:var(--accent);border-radius:3px;opacity:.5}

.center{display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{height:38px;flex:none;display:flex;align-items:center;gap:2px;padding:0 8px;border-bottom:1px solid var(--border);background:var(--win)}
.tool{width:32px;height:28px;border:0;background:transparent;border-radius:6px;display:grid;place-items:center;color:var(--text-2);position:relative}
.tool:hover{background:var(--hover);color:var(--text)}
.tool.on{background:var(--accent);color:var(--on-accent)}
.toolbar .sp{flex:1}
.toolbar .hint{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px}
.canvas{position:relative;flex:1;overflow:hidden;background:var(--canvas);
  background-image:radial-gradient(var(--canvas-dot) 1px,transparent 1px);background-size:20px 20px;cursor:default}
.canvas.pan{cursor:grab}.canvas.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.fwrap{position:absolute}
.flabel{position:absolute;left:0;bottom:100%;white-space:nowrap;color:var(--text-2);font-weight:500;padding-bottom:6px;cursor:default;transform-origin:0 100%}
.flabel:hover{color:var(--accent)}
.flabel.sel{color:var(--accent)}
.frame{position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.04)}
.ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ov svg{position:absolute;inset:0;width:100%;height:100%}
.box{position:absolute;pointer-events:none}
.box.hov{outline:1.5px solid var(--accent);outline-offset:0;opacity:.6}
.box.sel{outline:1.5px solid var(--accent)}
.box.sel i{position:absolute;width:7px;height:7px;background:#fff;border:1.5px solid var(--accent);border-radius:1px}
.box.sel i:nth-child(1){left:-4px;top:-4px}.box.sel i:nth-child(2){right:-4px;top:-4px}
.box.sel i:nth-child(3){left:-4px;bottom:-4px}.box.sel i:nth-child(4){right:-4px;bottom:-4px}
.box .dim{position:absolute;top:100%;left:50%;transform:translate(-50%,6px);background:var(--accent);color:#fff;font-size:10px;padding:1px 5px;border-radius:3px;white-space:nowrap;font-weight:600}
.box.ai{outline:2px solid var(--ai);background:var(--ai-soft);animation:aiPulse 1.2s ease-in-out 2}
.box.ai b{position:absolute;left:-2px;top:-18px;background:var(--ai);color:#fff;font-size:10px;padding:1px 5px;border-radius:3px 3px 3px 0;white-space:nowrap}
.box.pad{background:repeating-linear-gradient(45deg,rgba(236,72,153,.18) 0 4px,transparent 4px 8px);outline:1px dashed rgba(236,72,153,.6)}
@keyframes aiPulse{50%{background:transparent}}
.statusbar{height:28px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px;border-top:1px solid var(--border);background:var(--panel);font-size:12px;color:var(--text-2)}
.statusbar .sb{border:0;background:transparent;display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:5px;color:var(--text-2);font-size:12px}
.statusbar .sb:hover{background:var(--hover);color:var(--text)}
.statusbar .on-dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.statusbar .ai-l{color:var(--ai)}
.statusbar .sp{flex:1}
.statusbar .zoom{display:flex;align-items:center;gap:0}
.statusbar .zoom button{border:0;background:transparent;width:22px;height:22px;border-radius:4px;color:var(--text-2)}
.statusbar .zoom button:hover{background:var(--hover)}
.statusbar .zoom span{min-width:44px;text-align:center}

.right{background:var(--panel);border-left:1px solid var(--border);overflow:auto;min-height:0}
.rp-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}
.rp-h .ic{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;background:var(--panel-2);color:var(--text-2);font-size:12px;flex:none}
.rp-h input{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:5px;padding:3px 6px;font-weight:600}
.rp-h input:hover{border-color:var(--border)}
.rp-h input:focus{outline:none;border-color:var(--accent);background:var(--win)}
.rp-h .ty{font-size:11px;color:var(--text-2)}
.rs{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.rs h4{margin:0;font-size:11px;font-weight:600;color:var(--text-2);display:flex;align-items:center;justify-content:space-between}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fld{display:flex;align-items:center;gap:6px;height:26px;padding:0 8px;border-radius:5px;background:var(--panel-2);font-size:12px;min-width:0}
.fld span{color:var(--text-3);font-size:11px;width:12px}
.fld input,.fld select{border:0;background:transparent;width:100%;min-width:0;padding:0}
.fld input:focus,.fld select:focus{outline:none}
.fld .u{color:var(--text-3);font-size:11px;width:auto}
.row2{display:flex;align-items:center;gap:8px;font-size:12px}
.row2 > .l{width:56px;color:var(--text-2);flex:none}
.pills{display:flex;background:var(--panel-2);border-radius:5px;padding:2px;flex:1}
.pills b{flex:1;text-align:center;font-weight:500;font-size:11px;padding:2px 0;border-radius:4px;color:var(--text-2)}
.pills b.on{background:var(--win);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.tchip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:500;min-width:0;max-width:100%}
.tchip i{width:12px;height:12px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);flex:none}
.tchip em{font-style:normal;color:var(--text-2);font-weight:400}
.tchip.raw{background:var(--panel-2);color:var(--text)}
.rs .empty{color:var(--text-2);font-size:12px;line-height:1.6}
.rs .empty b{color:var(--text)}
.ix{border:1px solid var(--border);border-radius:8px;background:var(--win);padding:10px;display:flex;flex-direction:column;gap:8px}
.ix .row2 > .l{width:40px}
.code{position:relative;background:var(--code-bg);border:1px solid var(--border);border-radius:8px;overflow:auto;max-height:360px}
.code pre{margin:0;padding:10px 12px;font-size:11px;line-height:1.55;white-space:pre}
.code .k{color:var(--code-k)}.code .s{color:var(--code-s)}.code .t{color:var(--code-t)}.code .c{color:var(--code-c);font-style:italic}
.spec-chip{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--win);text-align:left}
.spec-chip:hover{border-color:var(--accent)}
.spec-chip .sp{flex:1}
.spec-chip small{display:block;color:var(--text-2);font-size:11px}
.btnrow{display:flex;gap:6px}
.btnrow .btn{flex:1}
.list-mini{display:flex;flex-direction:column;gap:4px}
.list-mini div{display:flex;align-items:center;gap:8px;font-size:12px}
.list-mini code{font-size:11px;color:var(--text-2);margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ───────────── 오른쪽 탭 · ✦ AI 채팅 (design.md §2-6) ───────────── */
.rtabs{display:flex;gap:2px;padding:6px 8px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);z-index:2}
.rtabs button{flex:1;border:0;background:transparent;padding:4px 0;border-radius:5px;font-size:12px;color:var(--text-2);display:flex;align-items:center;justify-content:center;gap:6px}
.rtabs button.on{background:var(--active);color:var(--text);font-weight:600}
.rtabs button[data-rtab="ai"].on{background:var(--ai-soft);color:var(--ai)}
.rtabs .kbd{margin:0;font-size:10px}
.right.ai-mode{overflow:hidden;display:flex;flex-direction:column}
.aip{flex:1;min-height:0;display:flex;flex-direction:column}
.ai-msgs{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.ai-empty{margin:auto 0;padding:16px;font-size:12px;color:var(--text-2);line-height:1.6;display:flex;flex-direction:column;gap:8px}
.ai-empty b{color:var(--text);font-size:13px}.ai-empty p{margin:0}
.ai-empty code.cmd{display:block;padding:8px 10px;border-radius:6px;background:var(--code-bg);border:1px solid var(--border);font-size:11px;word-break:break-all;color:var(--text)}
.msg{font-size:12px;line-height:1.6;border-radius:10px;padding:8px 10px;max-width:100%}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);max-width:88%}
.msg.me .ctx{font-size:10px;opacity:.8;margin-bottom:2px}
.msg.ai{background:var(--win);border:1px solid var(--border)}
.msg.ai.rev{opacity:.55}
.msg .mono{font-size:11px}
.msg .think{color:var(--ai);display:inline-block;animation:spin 1s linear infinite}
.msg .tools{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.msg .tools span{font-size:10px;color:var(--text-2);background:var(--panel-2);border-radius:4px;padding:1px 6px}
.msg .edits{display:flex;align-items:center;gap:4px;margin-top:8px;padding-top:6px;border-top:1px solid var(--border);color:var(--ai);font-size:11px;font-weight:600}
.msg .ds-warn{margin-top:8px;padding:5px 8px;border-radius:6px;background:var(--warn-soft);color:var(--warn);font-size:11px}
.msg .edits .sp{flex:1}
.msg .edits .btn{height:22px;font-size:11px;padding:0 6px;color:var(--text-2)}
.ai-in{flex:none;border-top:1px solid var(--border);padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.ai-ctx{display:flex;align-items:center;gap:6px;font-size:11px;min-width:0}
.ai-ctx .chip{max-width:170px;overflow:hidden;text-overflow:ellipsis}
.ai-ctx .hint{color:var(--text-3);white-space:nowrap}
.ai-sug{display:flex;flex-wrap:wrap;gap:4px}
.ai-sug button{border:1px solid var(--border);background:var(--win);border-radius:999px;padding:2px 9px;font-size:11px;color:var(--text-2)}
.ai-sug button:hover{border-color:var(--ai);color:var(--ai)}
.ai-box{display:flex;gap:6px;align-items:flex-end}
.ai-box textarea{flex:1;resize:none;border:1px solid var(--border-strong);border-radius:8px;padding:6px 8px;font-size:12px;background:var(--win);line-height:1.45}
.ai-box textarea:focus{outline:2px solid var(--ai-soft);border-color:var(--ai)}

/* ───────────── 화면 ↔ 코드 상태 (design.md §2-7) ───────────── */
.cs{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;margin:0 4px;white-space:nowrap}
.cs-none{color:var(--text-3)}.cs-stale{color:var(--warn)}.cs-ok{color:var(--ok)}.cs-draft{color:var(--text-3);font-weight:400}
.layers .row .cs{margin-left:auto}
.layers .row .cs + .aim{margin-left:0}
.rs h4 .cs{font-weight:600;font-size:11px}
.scr-list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.scr-list button{display:flex;align-items:center;gap:6px;border:0;border-bottom:1px solid var(--border);background:var(--win);padding:6px 8px;text-align:left;font-size:12px}
.scr-list button:last-child{border-bottom:0}
.scr-list button:hover{background:var(--hover)}
.scr-list .nm{flex:1;min-width:0}.scr-list .nm small{color:var(--text-3);margin-left:6px;font-size:10px}
.scr-list .rt{font-size:11px;color:var(--text-2)}
.scr-block{background:var(--accent-soft)}
#pages .dom{font-weight:600;color:var(--text-2);font-size:11px;margin-top:2px}
#pages .dom.on{color:var(--text)}
#pages .cnt{margin-left:auto;color:var(--text-3);font-size:11px;font-weight:400}
#pages .scr{padding-left:14px;gap:2px}
#pages .scr.drf{padding-left:30px;color:var(--text-2)}
#pages .scr.sel{background:var(--accent-soft);color:var(--accent)}
#pages .scr .cs{width:14px;margin:0 4px 0 0;justify-content:center}
#pages .scr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pages .scr .rt{font-size:10px;color:var(--text-3);max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pages{max-height:38%;overflow:auto}
.dlabel{position:absolute;font-size:var(--dl,120px);font-weight:800;color:var(--text-3);white-space:nowrap;letter-spacing:-.02em}

/* ───────────── 팝오버·모달·토스트 ───────────── */
.pop{position:absolute;z-index:40;background:var(--win);border-radius:10px;box-shadow:var(--shadow-pop);padding:6px;min-width:220px}
.pop .pi{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:6px 10px;border-radius:6px;font-size:12px;text-align:left}
.pop .pi:hover{background:var(--accent);color:var(--on-accent)}
.pop .pi:hover .kbd{color:inherit;opacity:.8}
.pop .ph{font-size:11px;color:var(--text-2);padding:6px 10px 2px;font-weight:600}
.pop .pbody{padding:8px 10px;display:flex;flex-direction:column;gap:8px;font-size:12px}
.pop code.cmd{display:block;padding:8px 10px;border-radius:6px;background:var(--code-bg);border:1px solid var(--border);font-size:11px;word-break:break-all}
.scrim{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.25);display:grid;place-items:center}
.modal{width:560px;max-width:calc(100% - 40px);max-height:calc(100% - 40px);overflow:hidden;background:var(--win);border-radius:12px;box-shadow:var(--shadow-pop);display:flex;flex-direction:column}
.modal-h{flex:none;padding:14px 18px;font-weight:700;font-size:14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.modal-b{padding:16px 18px;display:flex;flex-direction:column;gap:14px;overflow:auto;min-height:0}
.modal-b > *{flex-shrink:0}
.modal-f{flex:none;padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.modal-f .sp{flex:1;font-size:12px;color:var(--text-2)}
.fl{display:flex;flex-direction:column;gap:6px}
.fl > label{font-size:12px;font-weight:600;color:var(--text-2)}
.inp{height:30px;border:1px solid var(--border-strong);border-radius:6px;padding:0 10px;background:var(--win)}
.inp:focus,textarea.inp:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.inline{display:flex;gap:8px}.inline .inp{flex:1}
.plat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plat button{border:1.5px solid var(--border);border-radius:10px;background:var(--win);padding:14px;text-align:left;display:flex;gap:12px;align-items:flex-start}
.plat button:hover{border-color:var(--border-strong)}
.plat button.on{border-color:var(--accent);background:var(--accent-soft)}
.plat .pic{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--panel-2);color:var(--text-2);flex:none}
.plat button.on .pic{background:var(--accent);color:#fff}
.plat b{display:block;font-size:14px}
.plat small{color:var(--text-2);font-size:12px}
.detect{font-size:12px;color:var(--ok);background:var(--ok-soft);padding:8px 10px;border-radius:6px}
.ptable{width:100%;border-collapse:collapse;font-size:12px}
.ptable td{padding:6px 8px;border-top:1px solid var(--border)}
.ptable td:first-child{color:var(--text-2);width:110px}
.chg{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.chg button{display:flex;align-items:center;gap:10px;border:0;border-bottom:1px solid var(--border);background:var(--win);padding:8px 12px;text-align:left;font-size:12px}
.chg button:last-child{border-bottom:0}
.chg button:hover:not(:disabled){background:var(--hover)}
.chg button:disabled{cursor:default}
.chg .mk{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.mk.add{background:var(--ok-soft);color:var(--ok)}.mk.mod{background:var(--warn-soft);color:var(--warn)}
.mk.del{background:var(--danger-soft);color:var(--danger)}.mk.tok{background:var(--accent-soft);color:var(--accent)}
.chg .d{margin-left:auto;color:var(--text-2)}
textarea.inp{height:auto;min-height:150px;padding:8px 10px;resize:vertical;line-height:1.5;font-size:12px}
.author{font-size:12px;color:var(--text-2)}
.err{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:10px 12px;font-size:11px;white-space:pre-wrap;margin:0}
.toast-wrap{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#2a2a2e;color:#fff;padding:8px 14px;border-radius:8px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}

/* 미리보기 */
.pv-scrim{position:absolute;inset:0;z-index:55;background:#0e0e12;display:flex;flex-direction:column}
.pv-top{display:flex;align-items:center;gap:10px;padding:10px 16px;color:#ddd;font-size:12px}
.pv-top b{color:#fff}
.pv-top .sp{flex:1}
.pv-body{flex:1;display:grid;place-items:center;min-height:0;padding:10px 20px 24px}
.dev-web{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.dev-web .bar{height:34px;background:#ececee;display:flex;align-items:center;gap:10px;padding:0 12px}
.dev-web .bar .url{flex:1;max-width:420px;margin:0 auto;height:22px;border-radius:6px;background:#fff;font-size:11px;color:#666;display:flex;align-items:center;padding:0 10px}
.dev-phone{background:#111;border-radius:56px;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 0 0 2px #333}
.dev-phone .scr{border-radius:44px;overflow:hidden;position:relative}
.dev-phone .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000;z-index:3}
.pv-viewport{position:relative;overflow:hidden;background:#fff}
.pv-screen{position:absolute;left:0;top:0;transform-origin:0 0}
.pv-screen.in-push{animation:pvPush .3s ease-out}
.pv-screen.in-back{animation:pvBack .3s ease-out}
.pv-screen.in-fade{animation:pvFade .18s ease-out}
@keyframes pvPush{from{transform:translateX(100%) scale(var(--s))}to{transform:translateX(0) scale(var(--s))}}
@keyframes pvBack{from{transform:translateX(-30%) scale(var(--s));opacity:.6}to{transform:translateX(0) scale(var(--s));opacity:1}}
@keyframes pvFade{from{opacity:0}}
.pv-screen .hot{outline:3px solid rgba(37,99,235,.55);outline-offset:-2px;background-color:rgba(37,99,235,.12)}

/* ───────────── 디자인 시스템 화면 (design-system.md) ───────────── */
.canvas[hidden],.dsdoc[hidden]{display:none}
.dsdoc{flex:1;overflow:auto;background:var(--win);min-height:0}
.ds-in{max-width:1000px;margin:0 auto;padding:28px 36px 90px;display:flex;flex-direction:column;gap:40px}
.ds-hero h2{margin:10px 0 0;font-size:22px;letter-spacing:-.01em}
.ds-hero p{margin:6px 0 0;color:var(--text-2);line-height:1.65;max-width:720px}
.ds-hero .chips{display:flex;gap:6px;flex-wrap:wrap}
.ds-pr{margin:14px 0 0;padding:12px 14px 12px 32px;border-radius:10px;background:var(--panel);line-height:1.8;font-size:12px}
.ds-pr li::marker{color:var(--accent);font-weight:700}
.ds-sec{scroll-margin-top:16px}
.ds-sec h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}
.ds-sec .sub{margin:0 0 14px;color:var(--text-2);font-size:12px;line-height:1.65;max-width:760px}
.ds-sec .sub b{color:var(--text)}
.ds-sec h5{margin:18px 0 8px;font-size:11px;color:var(--text-2);font-weight:600}
.ds-pal{display:flex;gap:8px;flex-wrap:wrap}
.ds-sw{border:0;padding:4px;background:transparent;text-align:left;width:92px;font-size:10px;color:var(--text-2);border-radius:10px}
.ds-sw:hover{background:var(--hover)}
.ds-sw i{display:block;height:44px;border-radius:7px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);margin-bottom:5px}
.ds-sw b{display:block;color:var(--text);font-weight:600;font-size:11px}
.ds-rows{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.ds-row{display:grid;grid-template-columns:24px 150px 96px 72px minmax(0,1fr);gap:12px;align-items:center;width:100%;padding:9px 12px;border:0;border-bottom:1px solid var(--border);background:var(--win);text-align:left;font-size:12px}
.ds-row:last-child{border-bottom:0}
.ds-row:hover{background:var(--hover)}
.ds-row .sw{width:22px;height:22px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.ds-row .ref{color:var(--text-2)}
.ds-row .use{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ds-trow{grid-template-columns:minmax(0,1fr) 300px}
.ds-tsample{color:#111;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 0}
.ds-tmeta{display:flex;flex-direction:column;gap:2px;color:var(--text-2);font-size:11px}
.ds-tmeta b{color:var(--text);font-size:12px}
.ds-srow{grid-template-columns:110px 44px 200px minmax(0,1fr)}
.ds-srow .bar{height:12px;background:var(--accent);opacity:.45;border-radius:2px}
.ds-shape{display:flex;gap:12px;flex-wrap:wrap}
.ds-shape button{border:1px solid var(--border);background:var(--win);border-radius:10px;padding:12px;width:150px;text-align:left;font-size:11px;color:var(--text-2);display:flex;flex-direction:column;gap:8px}
.ds-shape button:hover{background:var(--hover)}
.ds-shape .shp{height:56px;background:#fff;box-shadow:inset 0 0 0 1.5px #c9cdd6}
.ds-shape b{color:var(--text);font-size:12px}
.ds-comp{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px;cursor:default;scroll-margin-top:16px}
.ds-comp:hover{border-color:var(--border-strong)}
.ds-ch{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel)}
.ds-ch .sp{margin-left:auto;font-size:11px;color:var(--text-2)}
.ds-stage{background:#fff;padding:20px;color:#111}
.ds-grid{display:grid;gap:14px 18px;align-items:center}
.ds-grid .gl{font-size:10px;color:#8a8f99;font-family:-apple-system,sans-serif}
.ds-grid .gc{display:flex;align-items:center;min-width:0}
.ds-stage .c-card{width:180px}
.ds-stage .c-nav,.ds-stage .c-item,.ds-stage .c-input,.ds-stage .c-box{width:100%}
.ds-cf{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;padding:10px 14px;font-size:12px;line-height:1.55;border-top:1px solid var(--border)}
.ds-cf > div{display:flex;gap:8px}
.ds-cf > div.w{grid-column:1/-1}
.ds-cf b{flex:none;font-size:11px;color:var(--text-2);width:44px}
.ds-cf b.ok{color:var(--ok)}.ds-cf b.no{color:var(--danger)}
.ds-rules{display:flex;flex-direction:column;gap:8px}
.ds-rule{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.6}
.ds-rule .no{font-weight:700;color:var(--accent)}
.ds-rule small{display:block;color:var(--text-2)}
.ds-on{outline:2px solid var(--accent)!important;outline-offset:-2px}
.ds-out button{display:flex;align-items:center;gap:6px;width:100%;border:0;background:transparent;text-align:left;padding:4px 8px;border-radius:5px;font-size:12px;color:var(--text)}
.ds-out button:hover{background:var(--hover)}
.ds-out button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.ds-entry{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:6px 8px;border-radius:6px;font-size:12px;font-weight:600}
.ds-entry:hover{background:var(--hover)}
.ds-entry.on{background:var(--accent-soft);color:var(--accent)}
.ds-entry .gm{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:11px;flex:none}
.ds-entry small{margin-left:auto;font-weight:400;color:var(--text-3);font-size:11px}
.ds-link{display:flex;align-items:center;gap:6px;width:calc(100% - 4px);margin:2px 2px 8px;border:1px dashed var(--border-strong);background:transparent;border-radius:6px;padding:6px 8px;font-size:11px;color:var(--accent)}
.ds-link:hover{background:var(--accent-soft)}
.rs textarea.inp{min-height:58px;font-size:12px;padding:6px 8px}
.rs input[type=color]{width:30px;height:24px;border:0;padding:0;background:transparent}
.ds-tree{margin:0;font-size:11px;line-height:1.6;color:var(--text-2);white-space:pre}
.dsopt{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.dsopt button:disabled{opacity:.55;cursor:not-allowed}
.imp-steps{display:flex;flex-direction:column;gap:6px}
.imp-steps > div{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--text-3)}
.imp-steps > div.done,.imp-steps > div.run{color:var(--text)}
.imp-steps .ic{width:16px;flex:none;text-align:center;font-weight:700}
.imp-steps .done .ic{color:var(--ok)}
.imp-steps .run .ic{color:var(--ai);animation:spin 1s linear infinite;display:inline-block}
.imp-steps small{display:block;color:var(--text-2);font-size:11px}
@keyframes spin{to{transform:rotate(360deg)}}
.imp-t{border:1px solid var(--border);border-radius:8px;overflow:hidden;font-size:12px}
.imp-t > div{display:grid;grid-template-columns:130px 190px minmax(0,1fr) 52px 74px;gap:10px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--border)}
.imp-t > div:last-child{border-bottom:0}
.imp-t > div.h{background:var(--panel);font-size:11px;font-weight:600;color:var(--text-2)}
.imp-t > div.off{opacity:.45}
.imp-t > div.off .mono{text-decoration:line-through}

.dz .c-input .ph-t{color:var(--t-color-muted)}

.dz .c-box{display:flex;flex-direction:column;gap:var(--t-spacing-2);padding:var(--t-spacing-6);border-radius:var(--t-radius-lg);background:var(--t-color-surface);font-size:var(--t-font-md)}

<script>
/* =====================================================================
   데이터: 디자인 시스템 (freegma/system/ 에 해당 — docs/design-system.md)
   - TOKENS  : 디자인에서 쓰는 «의미 토큰»의 계산된 값 (캔버스·코드 생성이 읽음)
   - PRIM    : 기초값(primitives). 디자인에서 직접 쓰지 않고 의미 토큰이 참조
   - SEM     : 의미 색 토큰 → 참조 + 용도/피할 곳 (AI가 읽는 설명)
   ===================================================================== */
const TOKENS = {
  'color.primary':'#2563EB','color.on-primary':'#FFFFFF','color.surface':'#FFFFFF','color.bg':'#F4F5F7',
  'color.text':'#111827','color.muted':'#6B7280','color.border':'#E5E7EB',
  'color.success':'#16A34A','color.warning':'#D97706','color.danger':'#DC2626',
  'spacing.1':4,'spacing.2':8,'spacing.3':12,'spacing.4':16,'spacing.5':20,'spacing.6':24,'spacing.8':32,'spacing.12':48,
  'radius.sm':6,'radius.md':10,'radius.lg':16,
  'font.sm':14,'font.md':16,'font.lg':20,'font.xl':28,'font.2xl':40,
  'shadow.sm':'0 1px 3px rgba(17,24,39,.08), 0 1px 2px rgba(17,24,39,.06)','shadow.md':'0 8px 24px rgba(17,24,39,.12)',
};
const DS={
  name:'my-shop 디자인 시스템', version:'1.0.0', font:'Pretendard', brand:'#2563EB', strict:'warn',
  principles:[
    '값은 토큰 이름으로만 쓴다 — 색·간격·모서리·글자 크기·그림자에 원시값(#3B82F6, 14px)을 쓰지 않는다.',
    '한 화면에서 primary 행동(버튼)은 하나만.',
    '버튼·입력창·카드처럼 시스템에 있는 것은 새로 그리지 않고 컴포넌트 인스턴스로 쓴다.',
    '글자와 배경의 명도 대비는 4.5:1 이상.',
  ],
};
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgb2hex=a=>'#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('').toUpperCase();
const mix=(h,t,k)=>{const a=hex2rgb(h),b=hex2rgb(t);return rgb2hex(a.map((v,i)=>v+(b[i]-v)*k));};
/* 브랜드 대표색 하나 → brand.50~900 단계 (프로젝트 만들 때·브랜드 색 바꿀 때 자동 생성) */
function brandScale(h){h=h.toUpperCase();return {'brand.50':mix(h,'#FFFFFF',.93),'brand.100':mix(h,'#FFFFFF',.84),'brand.300':mix(h,'#FFFFFF',.55),'brand.500':mix(h,'#FFFFFF',.2),'brand.600':h,'brand.700':mix(h,'#000000',.18),'brand.900':mix(h,'#000000',.5)};}
const PRIM={...brandScale(DS.brand),
  'gray.0':'#FFFFFF','gray.50':'#F9FAFB','gray.100':'#F4F5F7','gray.200':'#E5E7EB','gray.400':'#9CA3AF','gray.500':'#6B7280','gray.700':'#374151','gray.900':'#111827',
  'green.600':'#16A34A','amber.600':'#D97706','red.600':'#DC2626'};
const SEM={
  'color.primary':{ref:'brand.600',use:'가장 중요한 행동 1개(구매·저장·다음)의 버튼 배경, 강조 가격.',avoid:'긴 본문 글자, 넓은 배경 면.'},
  'color.on-primary':{ref:'gray.0',use:'color.primary 위에 놓이는 글자·아이콘.',avoid:''},
  'color.bg':{ref:'gray.100',use:'화면(페이지) 바탕.',avoid:'카드·시트의 면(→ color.surface).'},
  'color.surface':{ref:'gray.0',use:'카드·시트·내비게이션처럼 바탕 위에 올라오는 면.',avoid:''},
  'color.text':{ref:'gray.900',use:'기본 글자.',avoid:''},
  'color.muted':{ref:'gray.500',use:'보조 설명·메타 정보(카테고리, 날짜).',avoid:'버튼 라벨, 꼭 읽어야 하는 정보.'},
  'color.border':{ref:'gray.200',use:'구분선, 카드·입력창 테두리.',avoid:'글자색.'},
  'color.success':{ref:'green.600',use:'완료·성공 상태(배송 완료).',avoid:''},
  'color.warning':{ref:'amber.600',use:'주의가 필요한 상태(재고 적음).',avoid:'작은 글자색(대비 부족).'},
  'color.danger':{ref:'red.600',use:'오류 문구, 삭제 같은 되돌릴 수 없는 행동.',avoid:'단순 강조.'},
};
const TOKUSE={
  'spacing.1':'아이콘과 글자 사이','spacing.2':'붙어 있는 요소(상품명–가격)','spacing.3':'버튼 세로 여백, 목록 항목 사이','spacing.4':'카드 안 요소 사이, 모바일 화면 좌우 여백',
  'spacing.5':'버튼 가로 여백','spacing.6':'카드 안쪽 여백','spacing.8':'섹션 사이','spacing.12':'웹 페이지 바깥 여백',
  'radius.sm':'썸네일·작은 요소','radius.md':'버튼·입력창·상품 이미지','radius.lg':'카드·배너·시트',
  'shadow.sm':'살짝 떠 있는 요소','shadow.md':'떠 있는 카드(raised)·팝오버·바텀시트',
  'font.sm':'Caption 스타일','font.md':'Body 스타일·버튼','font.lg':'Title 스타일','font.xl':'Heading 스타일','font.2xl':'Display 스타일',
};
const TYPE=[
  {id:'display',name:'Display',size:'font.2xl',weight:800,lh:1.2,use:'배너·첫 화면의 큰 제목. 화면당 1개.',sample:'겨울 조명 기획전'},
  {id:'heading',name:'Heading',size:'font.xl',weight:700,lh:1.3,use:'페이지·섹션 제목.',sample:'추천 상품'},
  {id:'title',name:'Title',size:'font.lg',weight:700,lh:1.35,use:'카드 제목, 가격 강조.',sample:'북유럽 스탠드 조명'},
  {id:'body',name:'Body',size:'font.md',weight:400,lh:1.6,use:'본문·설명. 기본 스타일.',sample:'따뜻한 색감의 패브릭 갓과 원목 다리로 만든 스탠드 조명입니다.'},
  {id:'caption',name:'Caption',size:'font.sm',weight:400,lh:1.5,use:'보조 정보·메타(카테고리, 날짜).',sample:'리빙 · 조명 · 무료 배송'},
];
function syncTokens(){for(const [k,m] of Object.entries(SEM)) TOKENS[k]=PRIM[m.ref];}
syncTokens();

const TONES = {
  lamp:'linear-gradient(135deg,#f7e9d2,#e2bf8c)', linen:'linear-gradient(135deg,#eeeae2,#cdc3b2)',
  mug:'linear-gradient(135deg,#e6eef4,#b5c8d6)', wood:'linear-gradient(135deg,#eedcc5,#b88a5a)',

/* 노드 색인: id -> {node, parent, frame, page} */
function buildIndex(d){
  const idx={};
  for(const p of d.pages){
    for(const f of p.frames){
      (function walk(n,parent){ idx[n.id]={node:n,parent,frame:f,page:p}; (n.children||[]).forEach(c=>walk(c,n)); })(f,null);
    }
  }
  return idx;
}

  else if(n.h==='fill'){ if(pdir==='col'){s.flex='1 1 0';s.minHeight='0';} else s.alignSelf='stretch'; }
}
function padCss(p){return Array.isArray(p)?`${tv(p[0])} ${tv(p[1])}`:tv(p);}

function renderComponent(of,p,platform){

function renderNode(n,pdir,platform){
  let el;
  if(n.type==='instance'){el=renderComponent(n.of,n.props,platform);}
  else el=document.createElement('div');
  el.classList.add('n');
  el.dataset.id=n.id;
  const s=el.style;
  applySize(n,s,pdir);
  if(n.fill) s.background=tv(n.fill);
  if(n.radius) s.borderRadius=tv(n.radius);
  if(n.stroke) s.boxShadow=`inset 0 0 0 1px ${tv(n.stroke)}`;
  if(n.strokeTop) s.borderTop=`1px solid ${tv(n.strokeTop)}`;
  if(n.opacity) s.opacity=n.opacity;
  if(n.type==='frame'){
    if(n.layout){
      s.display='flex'; s.flexDirection=n.layout.dir==='row'?'row':'column';
      if(n.layout.gap) s.gap=tv(n.layout.gap);
      if(n.layout.pad) s.padding=padCss(n.layout.pad);
      if(n.layout.align) s.alignItems=n.layout.align;
      if(n.layout.justify) s.justifyContent=n.layout.justify;
    }
    if(n.safeBottom) s.paddingBottom=`calc(${n.layout&&n.layout.pad?tv(Array.isArray(n.layout.pad)?n.layout.pad[0]:n.layout.pad):'0px'} + 34px)`;
    for(const c of n.children) el.appendChild(renderNode(c,n.layout?(n.layout.dir==='row'?'row':'col'):'col',platform));
  } else if(n.type==='text'){
    s.fontSize=tv(n.size||'font.md'); s.fontWeight=n.weight||400; s.color=tv(n.color||'color.text'); s.lineHeight=n.lh||1.35;
    el.textContent=n.text;
  } else if(n.type==='image'){
    el.classList.add('ph'); s.background=TONES[n.tone]||TONES.lamp; el.innerHTML=PH_SVG;
  }
  return el;
}

/* ---------- Claude 가져오기: 분석 진행 → 초안 확인 (design-system.md §2-2) ---------- */
const IMPORT_STEPS=[
  ['저장소 훑기','scan_repo_values — 색 41개 · 간격 23개 · 글자 크기 9개 · 그림자 3개 집계'],

  ['글자 스타일','사용 빈도로 5개 — text-4xl/2xl/lg/base/sm'],
  ['컴포넌트 연결','update_components — Button · Input · Badge · Card ← components/ui/*'],

let importTimer=0;
function openClaudeImport(ctx){
  let i=0;
  const draw=()=>{
    $('#layer-modal').innerHTML=`<div class="scrim"><div class="modal" role="dialog" aria-label="저장소 분석">
      <div class="modal-h">✦ Claude가 저장소를 분석하는 중</div>
      <div class="modal-b">
        <code class="mono" style="display:block;padding:8px 10px;border-radius:6px;background:var(--code-bg);border:1px solid var(--border);font-size:11px;word-break:break-all">${esc(CLAUDE_CMD)}</code>
        <div class="author">이 PC의 Claude Code를 사용자 로그인으로 실행합니다. <b>읽기 도구 + freegma MCP만 허용</b> — 서비스 코드는 고칠 수 없고, freegma/에도 MCP(스키마 검증)를 거쳐서만 씁니다.</div>
        <div class="imp-steps">${IMPORT_STEPS.map(([t,d],k)=>`<div class="${k<i?'done':k===i?'run':''}"><span class="ic">${k<i?'✓':k===i?'◌':'·'}</span><span><b>${t}</b>${k<=i?`<small>${d}</small>`:''}</span></div>`).join('')}</div>
      </div>
      <div class="modal-f"><span class="sp">${ctx.reimport?'끝나면 초안을 확인한 뒤 지금 시스템을 바꿉니다.':'취소하면 기본 템플릿으로 만듭니다.'}</span><button class="btn" id="ci-cancel">취소</button></div>
    </div></div>`;
    $('#ci-cancel').onclick=()=>{clearTimeout(importTimer); if(ctx.reimport){closeModal();toast('가져오기를 취소했습니다');} else {ctx.dsFrom='template'; finishCreate(ctx);}};
  };
  draw();
  const tick=()=>{i++; if(i>=IMPORT_STEPS.length){openImportDraft(ctx);return;} draw(); importTimer=setTimeout(tick,520);};
  clearTimeout(importTimer); importTimer=setTimeout(tick,520);
}
function importRows(plat){

    {k:'color.text',v:'→ gray.900',sw:'#111827',src:`${css}:9 --foreground`,c:'높음'},

    $('#layer-modal').innerHTML=`<div class="scrim"><div class="modal wide" role="dialog" aria-label="가져오기 초안">
      <div class="modal-h">가져오기 초안 <span class="chip">Claude 분석 결과</span><span class="chip mono">freegma/system/IMPORT_REPORT.md</span></div>

        <div class="empty" style="font-size:12px;color:var(--text-2);line-height:1.6">저장소의 방식을 freegma 형식으로 다시 만든 초안입니다. 확신이 낮은 항목은 확인하고, 필요 없으면 «버리기»를 누르세요. 버린 의미 토큰은 템플릿 값으로 채웁니다.</div>

        </div>
        <div class="step warn">⚠ <span class="sp"><b>옮기지 못함</b> — chart-1~5(차트 전용 색 5개), sidebar-* 변수 8개(사이드바 전용). 서비스 컴포넌트를 만들 때 쓰려면 Claude에게 다시 요청하세요.</span></div>
      </div>
      <div class="modal-f"><button class="btn" id="im-tpl">버리고 템플릿으로</button><span class="sp"></span><button class="btn" id="im-retry">✦ Claude에게 다시 요청</button><button class="btn primary" id="im-ok">확정</button></div>
    </div></div>`;
    document.querySelectorAll('[data-imp]').forEach(b=>b.onclick=()=>{const r=rows[+b.dataset.imp]; r.keep=!r.keep; draw();});
    const fs=document.querySelector('[data-imp-font]'); if(fs) fs.onchange=e=>{font=e.target.value;};

    $('#im-tpl').onclick=()=>{if(ctx.reimport){closeModal();toast('초안을 버렸습니다 — 지금 시스템을 유지합니다');return;} ctx.dsFrom='template'; finishCreate(ctx);};
    $('#im-ok').onclick=()=>{
      const brand=rows[0].keep?'#4F46E5':ctx.brand||DS.brand;

        const from=DS.brand; DS.brand=brand; DS.font=font; Object.assign(PRIM,brandScale(brand)); syncTokens();
        markDs({label:'저장소에서 다시 만들기',from:'',to:'',text:true,sel:''}); if(from!==brand) markDs({label:'brand (브랜드 색)',from,to:brand,sel:''});

        return;
      }
      ctx.brand=brand; ctx.font=font; finishCreate(ctx);

  draw();

function renderEditor(){
  $('#h-proj').textContent=state.project;
  renderBranchChip();
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.mode===state.mode));
  renderHeaderGit(); renderPages(); renderLeft(); renderToolbar(); renderCanvas(); renderRight(); renderStatus();
}
function changeItems(){
  const d=state.data, items=[];
  if(state.baseChanges){
    items.push({k:'add',label:`${d.changes.added.page} / ${d.changes.added.frame}`,target:d.changes.added.target,group:'추가'});
    items.push({k:'mod',label:`${d.changes.modified.page} / ${d.changes.modified.frame}`,detail:'간격, 버튼 색',target:d.changes.modified.target,group:'수정'});
    items.push({k:'del',label:'상품 / 옛 시안',group:'삭제'});
    items.push({k:'tok',label:'color.primary',detail:'#3B82F6 → #2563EB',group:'디자인 시스템',tok:true,ds:'tok:color.primary'});
  }
  for(const [,e] of state.dsEdits){
    items.push({k:'tok',label:e.label,detail:e.text?'설명 수정':`${e.from} → ${e.to}`,group:'디자인 시스템',tok:true,ds:e.sel});
  }
  for(const id of state.added){const e=state.index[id]; items.push({k:'add',label:`${e.page.name} / ${e.node.name}`,detail:e.node.role==='screen'?'화면 '+e.node.route:'시안',target:id,group:'추가'});}
  for(const [fid,kinds] of state.edits){
    if(state.added.includes(fid)) continue;
    const e=state.index[fid];
    items.push({k:'mod',label:`${e.page.name} / ${e.node.name}`,detail:[...kinds].join(', '),target:fid,group:'수정'});
  }
  return items;
}
function renderHeaderGit(){
  const n=changeItems().length, btn=$('#h-commit'), ch=$('#h-changes');

  ch.classList.toggle('zero',!n);
  const conflict=$('#fl-conflict').checked;
  btn.classList.toggle('primary',!conflict); btn.classList.toggle('warn',conflict);
  btn.textContent=conflict?'⚠ 충돌 해결 필요':'커밋';
  btn.disabled=!conflict&&(state.noGit||!n);

/* ---------- 캔버스 ---------- */
function renderCanvas(){
  const w=$('#world'); w.innerHTML=''; w.setAttribute('style',tokenStyleVars());
  const enterDs=isDS()&&$('#dsdoc').hidden;
  $('#canvas').hidden=isDS(); $('#dsdoc').hidden=!isDS();
  if(enterDs) $('#dsdoc').scrollTop=0;
  if(isDS()){renderDsDoc();return;}
  if(state.page==='all') for(const p of state.data.pages){const f0=p.frames[0]; const t=document.createElement('div'); t.className='dlabel'; t.style.setProperty('--dl',state.platform==='mobile'?'64px':'120px'); t.style.left='0px'; t.style.top=(f0.ay-(state.platform==='mobile'?230:400))+'px'; t.textContent=p.name; w.appendChild(t);}
  for(const f of curPage().frames){
    const P=pos(f), wrap=document.createElement('div'); wrap.className='fwrap'; wrap.style.left=P.x+'px'; wrap.style.top=P.y+'px';
    const lab=document.createElement('div'); lab.className='flabel'+(state.sel===f.id?' sel':''); lab.dataset.selframe=f.id;
    lab.innerHTML=`${csBadge(f)}${esc(f.name)}  <span style="opacity:.7">${f.w}×${f.h}</span>${f.role==='screen'?` <span class="mono" style="opacity:.7">${esc(f.route)}</span>`:''}`;
    const fr=renderNode(f,'col',state.platform); fr.classList.add('frame');
    fr.style.width=f.w+'px'; fr.style.height=f.h+'px';
    wrap.appendChild(lab); wrap.appendChild(fr); w.appendChild(wrap);
  }
  applyView();
}
function applyView(){
  const v=state.view;
  $('#world').style.transform=`translate(${v.x}px,${v.y}px) scale(${v.s})`;
  document.querySelectorAll('.flabel').forEach(l=>{l.style.transform=`scale(${1/v.s})`;l.style.fontSize='12px';});
  $('#zoom-t').textContent=Math.round(v.s*100)+'%';
  updateOverlay();
}
function fit(){
  if(isDS()) return;
  const c=$('#canvas').getBoundingClientRect(), fr=curPage().frames;
  if(!c.width) return;
  const minX=Math.min(...fr.map(f=>pos(f).x)),minY=Math.min(...fr.map(f=>pos(f).y)),maxX=Math.max(...fr.map(f=>pos(f).x+f.w)),maxY=Math.max(...fr.map(f=>pos(f).y+f.h));
  const bw=maxX-minX,bh=maxY-minY;
  const s=Math.min((c.width-120)/bw,(c.height-110)/bh,1);
  state.view={s,x:(c.width-bw*s)/2-minX*s,y:(c.height-bh*s)/2-minY*s+12};
  applyView();
}
function zoomAt(f,mx,my){
  const v=state.view, ns=Math.min(4,Math.max(.05,v.s*f));
  v.x=mx-(mx-v.x)*(ns/v.s); v.y=my-(my-v.y)*(ns/v.s); v.s=ns; applyView();
}
function elOf(id){return $('#world').querySelector(`[data-id="${CSS.escape(id)}"]`);}
function relRect(el){const r=el.getBoundingClientRect(),c=$('#canvas').getBoundingClientRect();return {x:r.left-c.left,y:r.top-c.top,w:r.width,h:r.height};}
let ovRaf=0;
function updateOverlay(){
  if(ovRaf) return;
  ovRaf=requestAnimationFrame(()=>{ovRaf=0;drawOverlay();});
}
function drawOverlay(){
  const ov=$('#ov'); if(!state.data) return;
  let html='';
  const s=state.view.s;
  // 프로토타입 연결선
  if(state.mode==='proto'){
    let paths='';
    for(const [from,ix] of Object.entries(state.data.interactions)){
      const fe=elOf(from), te=elOf(ix.to); if(!fe||!te) continue;
      const a=relRect(fe), b=relRect(te);
      const right=b.x>a.x+a.w/2;
      const sx=right?a.x+a.w:a.x, sy=a.y+a.h/2, ex=right?b.x:b.x+b.w;
      const ey2=Math.max(b.y+20,Math.min(b.y+b.h-20,sy));
      const dx=Math.max(40,Math.abs(ex-sx)/2)*(right?1:-1);
      const sel=state.sel===from;
      paths+=`<path d="M${sx},${sy} C${sx+dx},${sy} ${ex-dx},${ey2} ${ex},${ey2}" fill="none" stroke="var(--accent)" stroke-width="${sel?2.5:1.5}" opacity="${sel?1:.75}" marker-end="url(#ah)"/><circle cx="${sx}" cy="${sy}" r="4" fill="var(--accent)"/>`;
    }
    html+=`<svg><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--accent)"/></marker></defs>${paths}</svg>`;
  }
  // AI 수정 강조
  if(state.aiFlash){
    for(const id of (state.flashIds||state.data.ai)){const e=elOf(id); if(!e) continue; const r=relRect(e);
      html+=`<div class="box ai" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px"><b>✦ AI 수정</b></div>`;}
  }
  // 호버
  if(state.hover&&state.hover!==state.sel){const e=elOf(state.hover); if(e){const r=relRect(e); html+=`<div class="box hov" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px"></div>`;}}
  // 선택
  if(state.sel){const e=elOf(state.sel); if(e){const r=relRect(e);
    const n=state.index[state.sel].node;
    // 개발 모드: 패딩 표시
    if(state.mode==='dev'&&n.type==='frame'&&n.layout&&n.layout.pad){
      const p=Array.isArray(n.layout.pad)?[num(n.layout.pad[0]),num(n.layout.pad[1])]:[num(n.layout.pad),num(n.layout.pad)];
      const py=p[0]*s, px=p[1]*s;
      html+=`<div class="box pad" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${py}px"></div><div class="box pad" style="left:${r.x}px;top:${r.y+r.h-py}px;width:${r.w}px;height:${py}px"></div><div class="box pad" style="left:${r.x}px;top:${r.y+py}px;width:${px}px;height:${r.h-2*py}px"></div><div class="box pad" style="left:${r.x+r.w-px}px;top:${r.y+py}px;width:${px}px;height:${r.h-2*py}px"></div>`;
    }
    html+=`<div class="box sel" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px"><i></i><i></i><i></i><i></i><span class="dim">${Math.round(r.w/s)} × ${Math.round(r.h/s)}</span></div>`;
  }}
  ov.innerHTML=html;
}

/* ---------- 선택 ---------- */
function select(id,{reveal}={}){
  if(id&&state.index[id]&&state.page!=='all'&&state.index[id].page.id!==state.page){state.page=state.index[id].page.id;state.dsSel=null;renderPages();renderLeft();renderToolbar();renderCanvas();requestAnimationFrame(fit);}
  state.sel=id;
  if(id&&reveal!==false){ // 레이어 트리 펼치기
    let p=state.index[id].parent; while(p){state.collapsed.delete(p.id);p=state.index[p.id].parent;}
  }
  document.querySelectorAll('.flabel').forEach(l=>l.classList.toggle('sel',l.dataset.selframe===id));
  if(state.ltab==='layers') renderLeft();
  document.querySelectorAll('#pages .scr').forEach(b=>b.classList.toggle('sel',b.dataset.goscreen===id));
  renderRight(); updateOverlay();
  const row=document.querySelector(`.layers .row[data-sel="${CSS.escape(id||'')}"]`); if(row) row.scrollIntoView({block:'nearest'});
}

/* =====================================================================
   오른쪽 패널
   ===================================================================== */
function tchip(v){
  if(isTok(v)){
    const x=TOKENS[v];
    if(v.startsWith('color.')) return `<span class="tchip" title="토큰에 연결됨"><i style="background:${x}"></i>${v}</span>`;
    return `<span class="tchip" title="토큰에 연결됨">${v} <em>${x}</em></span>`;
  }
  if(typeof v==='string'&&v.startsWith('#')) return `<span class="tchip raw"><i style="background:${v}"></i>${v}</span>`;
  return `<span class="tchip raw">${v}</span>`;
}
function measure(id){
  const e=elOf(id); if(!e) return null;
  const s=state.view.s, r=e.getBoundingClientRect();
  const fr=elOf(state.index[id].frame.id).getBoundingClientRect();
  return {x:Math.round((r.left-fr.left)/s),y:Math.round((r.top-fr.top)/s),w:Math.round(r.width/s),h:Math.round(r.height/s)};
}
function sizeMode(v){return typeof v==='number'?'고정':v==='fill'?'채우기':'내용 맞춤';}
function pills(cur){return `<div class="pills">${['고정','채우기','내용 맞춤'].map(x=>`<b class="${x===cur?'on':''}">${x}</b>`).join('')}</div>`;}
function rpHeader(n){
  return `<div class="rp-h"><span class="ic" style="${n.type==='instance'?'color:var(--accent)':''}">${TYPE_IC[n.type]}</span><input value="${esc(n.name)}" data-edit="name" aria-label="레이어 이름"><span class="ty">${TYPE_KO[n.type]}</span></div>`;
}
/* 오른쪽 패널 폭: 속성 340 · ✦ AI 400 · 개발(코드) 420 기본, 경계를 끌어 조절(280~640), 탭별로 기억 */
const RP_DEF={props:340,ai:400,dev:420};
const RP=(()=>{try{return {...RP_DEF,...JSON.parse(localStorage.getItem('freegma-mock-rp')||'{}')};}catch(e){return {...RP_DEF};}})();
const rpKey=()=>state.rtab==='ai'?'ai':state.mode==='dev'?'dev':'props';
function setRp(){document.querySelector('.editor').style.setProperty('--rp',RP[rpKey()]+'px');}
function saveRp(){try{localStorage.setItem('freegma-mock-rp',JSON.stringify(RP));}catch(e){}}
(()=>{
  const h=document.getElementById('rp-drag'); let d=null;
  h.addEventListener('mousedown',e=>{d={x:e.clientX,w:RP[rpKey()]};h.classList.add('on');e.preventDefault();});
  window.addEventListener('mousemove',e=>{if(!d)return; RP[rpKey()]=Math.max(280,Math.min(640,d.w+(d.x-e.clientX))); setRp(); updateOverlay();});
  window.addEventListener('mouseup',()=>{if(d){d=null;h.classList.remove('on');saveRp();}});
  h.addEventListener('dblclick',()=>{RP[rpKey()]=RP_DEF[rpKey()];setRp();saveRp();updateOverlay();});
})();

/* =====================================================================
   개발 모드: 코드 생성 (결정적 — design.md §7)
   ===================================================================== */
const tk=t=>t.split('.')[1];
const camel=s=>s.replace(/-(\w)/g,(_,c)=>c.toUpperCase());
function webClasses(n,pdir,top){
  const c=[];
  if(n.type==='frame'&&n.layout){
    const L=n.layout; c.push('flex',L.dir==='row'?'flex-row':'flex-col');
    if(L.gap) c.push('gap-'+tk(L.gap));
    if(L.pad) Array.isArray(L.pad)?c.push('py-'+tk(L.pad[0]),'px-'+tk(L.pad[1])):c.push('p-'+tk(L.pad));
    if(L.align) c.push({'flex-start':'items-start','center':'items-center','flex-end':'items-end'}[L.align]);
    if(L.justify) c.push({'space-between':'justify-between','center':'justify-center'}[L.justify]);
  }
  if(top) c.push('min-h-screen');
  else{
    if(typeof n.w==='number') c.push(`w-[${n.w}px]`); else if(n.w==='fill') c.push(pdir==='row'?'flex-1':'w-full');
    if(typeof n.h==='number') c.push(n.h===1?'h-px':`h-[${n.h}px]`); else if(n.h==='fill') c.push(pdir==='col'?'flex-1':'self-stretch');
  }
  if(n.fill) c.push(isTok(n.fill)?'bg-'+tk(n.fill):`bg-[${n.fill}]`);
  if(n.radius) c.push('rounded-'+tk(n.radius));
  if(n.stroke) c.push('border','border-'+tk(n.stroke));
  if(n.strokeTop) c.push('border-t','border-'+tk(n.strokeTop));
  if(n.type==='text'){
    c.push('text-'+tk(n.size||'font.md'));
    const w={500:'font-medium',600:'font-semibold',700:'font-bold',800:'font-extrabold'}[n.weight]; if(w) c.push(w);
    if(n.color&&n.color!=='color.text') c.push('text-'+tk(n.color));
    if(n.lh) c.push('leading-relaxed');
  }
  if(n.opacity) c.push('opacity-'+Math.round(n.opacity*100));
  if(n.type==='image') c.push('object-cover');
  return c.join(' ');
}
function genWeb(root){
  const imports=new Map();
  const line=(ind,s)=>' '.repeat(ind)+s;
  const jsx=(n,ind,pdir,top)=>{
    const cls=webClasses(n,pdir,top);
    if(n.type==='frame'){
      if(!n.children.length) return line(ind,`<div className="${cls}" />`);
      return [line(ind,`<div className="${cls}">`),...n.children.map(ch=>jsx(ch,ind+2,n.layout&&n.layout.dir==='row'?'row':'col')),line(ind,'</div>')].join('\n');
    }
    if(n.type==='text'){const tag=(n.size==='font.xl'||n.size==='font.2xl')?'h2':'p';return line(ind,`<${tag} className="${cls}">${n.text}</${tag}>`);}
    if(n.type==='image') return line(ind,`<img src="/images/${n.tone}.jpg" alt="${n.name}" className="${cls}" />`);
    if(n.type==='rect') return line(ind,`<div className="${cls}" />`);
    if(n.type==='instance'){
      const c=COMPONENTS[n.of]; imports.set(c.name,c.web); const p=n.props;
      const wcls=n.w==='fill'?(pdir==='row'?' className="flex-1"':' className="w-full"'):'';
      if(n.of==='button') return line(ind,`<Button variant="${p.variant}"${wcls}>${p.label}</Button>`);
      if(n.of==='nav-bar') return line(ind,`<NavBar title="${p.title}"${p.back?' showBack':''} />`);
      if(n.of==='product-card') return line(ind,`<ProductCard title="${p.title}" price="${p.price}" image="/images/${p.tone}.jpg"${wcls} />`);
      if(n.of==='cart-item') return line(ind,`<CartItem title="${p.title}" price="${p.price}" quantity={${p.qty}} />`);
    }
    return '';
  };
  const isFrame=root.type==='frame', top=!state.index[root.id].parent;
  const pdir=state.index[root.id].parent&&state.index[root.id].parent.layout&&state.index[root.id].parent.layout.dir==='row'?'row':'col';
  const body=jsx(root,isFrame?4:0,pdir,top);
  const imp=[...imports].map(([n,p])=>`import { ${n} } from "${p}";`).join('\n');
  if(isFrame) return `${imp?imp+'\n\n':''}export function ${root.k||'Section'}() {\n  return (\n${body}\n  );\n}`;
  return `${imp?imp+'\n\n':''}${body}`;
}
function rnTok(v){
  if(!isTok(v)) return typeof v==='number'?v:`"${v}"`;
  const [g,k]=v.split('.');
  if(g==='spacing') return `spacing[${k}]`;
  return `${g}.${/^\d/.test(k)||k.includes('-')?camel(k).replace(/^(\d)/,'x$1'):k}`.replace('font.x2xl','font.xxl');
}
function genRN(root){
  const imports=new Map(), rn=new Set(), styles=[];
  const line=(ind,s)=>' '.repeat(ind)+s;
  const key=n=>n.k?n.k.charAt(0).toLowerCase()+n.k.slice(1):camel(n.id.replace(/^m-/,''));
  const addStyle=(n,pdir,top)=>{
    const o=[];
    if(n.type==='frame'&&n.layout){
      const L=n.layout; o.push(`flexDirection: "${L.dir==='row'?'row':'column'}"`);
      if(L.gap) o.push(`gap: ${rnTok(L.gap)}`);
      if(L.pad) Array.isArray(L.pad)?o.push(`paddingVertical: ${rnTok(L.pad[0])}`,`paddingHorizontal: ${rnTok(L.pad[1])}`):o.push(`padding: ${rnTok(L.pad)}`);
      if(L.align) o.push(`alignItems: "${L.align}"`);
      if(L.justify) o.push(`justifyContent: "${L.justify}"`);
    }
    if(top) o.push('flex: 1');
    else{
      if(typeof n.w==='number') o.push(`width: ${n.w}`); else if(n.w==='fill') o.push(pdir==='row'?'flex: 1':'alignSelf: "stretch"');
      if(typeof n.h==='number') o.push(n.h===1?'height: StyleSheet.hairlineWidth':`height: ${n.h}`); else if(n.h==='fill') o.push(pdir==='col'?'flex: 1':'alignSelf: "stretch"');
    }
    if(n.fill) o.push(`backgroundColor: ${rnTok(n.fill)}`);
    if(n.radius) o.push(`borderRadius: ${rnTok(n.radius)}`);
    if(n.stroke) o.push('borderWidth: 1',`borderColor: ${rnTok(n.stroke)}`);
    if(n.strokeTop) o.push('borderTopWidth: StyleSheet.hairlineWidth',`borderTopColor: ${rnTok(n.strokeTop)}`);
    if(n.safeBottom) o.push('paddingBottom: insets.bottom');
    if(n.type==='text'){o.push(`fontSize: ${rnTok(n.size||'font.md')}`); if(n.weight&&n.weight!==400) o.push(`fontWeight: "${n.weight}"`); o.push(`color: ${rnTok(n.color||'color.text')}`);}
    if(n.opacity) o.push(`opacity: ${n.opacity}`);
    styles.push([key(n),o]);
  };
  const jsx=(n,ind,pdir,top)=>{
    if(n.type==='instance'){
      const c=COMPONENTS[n.of]; imports.set(c.name,c.mobile); const p=n.props;
      const st=n.w==='fill'&&pdir==='row'?' style={{ flex: 1 }}':'';
      if(n.of==='button') return line(ind,`<Button variant="${p.variant}" title="${p.label}"${st} />`);
      if(n.of==='nav-bar') return line(ind,`<NavBar title="${p.title}"${p.back?' showBack':''} />`);
      if(n.of==='product-card') return line(ind,`<ProductCard title="${p.title}" price="${p.price}" image={images.${p.tone}}${st} />`);
      if(n.of==='cart-item') return line(ind,`<CartItem title="${p.title}" price="${p.price}" quantity={${p.qty}} />`);
    }
    addStyle(n,pdir,top);
    const k=key(n);
    if(n.type==='frame'){
      rn.add('View');
      if(!n.children.length) return line(ind,`<View style={styles.${k}} />`);
      return [line(ind,`<View style={styles.${k}}>`),...n.children.map(ch=>jsx(ch,ind+2,n.layout&&n.layout.dir==='row'?'row':'col')),line(ind,'</View>')].join('\n');
    }
    if(n.type==='text'){rn.add('Text');return line(ind,`<Text style={styles.${k}}>${n.text}</Text>`);}
    if(n.type==='image'){rn.add('Image');return line(ind,`<Image source={images.${n.tone}} style={styles.${k}} />`);}
    rn.add('View'); return line(ind,`<View style={styles.${k}} />`);
  };
  const isFrame=root.type==='frame', top=!state.index[root.id].parent;
  const par=state.index[root.id].parent;
  const body=jsx(root,isFrame?4:0,par&&par.layout&&par.layout.dir==='row'?'row':'col',top);
  rn.add('StyleSheet');
  const usesTok=styles.some(([,o])=>o.join().match(/color\.|spacing\[|radius\.|font\./));
  let imp=`import { ${[...rn].join(', ')} } from "react-native";`;
  for(const [n,p] of imports) imp+=`\nimport { ${n} } from "${p}";`;
  if(usesTok) imp+=`\nimport { color, spacing, radius, font } from "@/theme/tokens";`;
  const st=styles.length?`\n\nconst styles = StyleSheet.create({\n${styles.map(([k,o])=>`  ${k}: {\n${o.map(x=>'    '+x+',').join('\n')}\n  },`).join('\n')}\n});`:'';
  if(isFrame) return `${imp}\n\nexport function ${root.k||'Section'}() {\n  return (\n${body}\n  );\n}${st}`;
  return `${imp}\n\n${body}${st}`;
}
function hl(code){
  return esc(code).replace(/("(?:[^"\\]|\\.)*")|\b(import|from|export|function|return|const)\b|(&lt;\/?)([A-Za-z][\w.]*)|(\/\*.*?\*\/)/g,(m,s,k,lt,tag,cm)=>{
    if(s) return `<span class="s">${s}</span>`;
    if(k) return `<span class="k">${k}</span>`;
    if(lt) return `${lt}<span class="t">${tag}</span>`;
    if(cm) return `<span class="c">${cm}</span>`;
    return m;
  });
}
function tokensUsed(n){
  const set=new Set();
  (function w(x){
    for(const v of [x.fill,x.stroke,x.strokeTop,x.radius,x.size,x.color,x.layout&&x.layout.gap,...(x.layout&&x.layout.pad?[].concat(x.layout.pad):[])]) if(isTok(v)) set.add(v);
    if(x.type==='text'&&!x.color) set.add('color.text');
    (x.children||[]).forEach(w);
  })(n);
  return [...set];
}
function compsUsed(n){const s=new Set();(function w(x){if(x.type==='instance')s.add(x.of);(x.children||[]).forEach(w);})(n);return [...s];}
let lastCode='';
function devPanel(n){
  const d=state.data;
  let h=`<div class="rs"><button class="spec-chip" data-act="spec"><span>${d.platform==='web'?ICON.web:ICON.mobile}</span><span class="sp"><b>${d.spec}</b><small class="mono">freegma/spec.json · ${d.specFile}</small></span>▾</button></div>`;
  if(!n){

      : `/* src/theme/tokens.ts — freegma/system/tokens 에서 생성 */\nexport const color = {\n${Object.entries(TOKENS).filter(([k])=>k.startsWith('color.')).map(([k,v])=>`  ${camel(tk(k))}: "${v}",`).join('\n')}\n};\nexport const spacing = { ${Object.entries(TOKENS).filter(([k])=>k.startsWith('spacing.')).map(([k,v])=>`${tk(k)}: ${v}`).join(', ')} };`;

      <div class="rs"><h4>토큰 내보내기 미리보기</h4><div class="code"><pre class="mono">${hl(css)}</pre></div>
      <div class="btnrow"><button class="btn small" data-act="copy">복사</button></div>
      <div class="empty" style="font-size:11px">앱은 코드 파일에 직접 쓰지 않습니다. 코드 쪽 토큰 파일과 값이 다르면 알려 줍니다.</div></div>`;

  h+=devScreenBlock(n);
  h+=`<div class="rs"><h4>코드 <span class="chip">결정적 생성 · AI 없음</span></h4><div class="code"><pre class="mono">${hl(code)}</pre></div>
    <div class="btnrow"><button class="btn small" data-act="copy">복사</button></div></div>`;
  const toks=tokensUsed(n);
  if(toks.length) h+=`<div class="rs"><h4>쓰인 토큰</h4><div style="display:flex;flex-wrap:wrap;gap:4px">${toks.map(tchip).join('')}</div></div>`;
  const comps=compsUsed(n);
  if(comps.length) h+=`<div class="rs"><h4>연결된 컴포넌트</h4><div class="list-mini">${comps.map(c=>`<div><span style="color:var(--accent)">◇</span>${COMPONENTS[c].name}<code class="mono">${COMPONENTS[c][d.platform]}</code></div>`).join('')}</div></div>`;
  if(n.type==='frame'&&n.layout){
    const L=n.layout;
    h+=`<div class="rs"><h4>측정</h4><div class="list-mini">

      <div>패딩 <span style="width:10px;height:10px;background:rgba(236,72,153,.35);display:inline-block;border-radius:2px"></span><code class="mono">${L.pad?[].concat(L.pad).map(p=>p+' = '+TOKENS[p]).join(' / '):'0'}</code></div></div></div>`;
  }
  return h;

/* =====================================================================
   디자인 시스템 화면 (docs/design-system.md)
   왼쪽 «디자인 시스템» → 가운데 문서 화면(견본) · 오른쪽 편집 패널
   ===================================================================== */
const DS_ANCHOR=sel=>{
  if(!sel) return 'ds-top';
  const [k,v]=[sel.slice(0,sel.indexOf(':')),sel.slice(sel.indexOf(':')+1)];
  if(k==='comp') return 'ds-c-'+v;
  if(k==='prim'||(k==='tok'&&v.startsWith('color.'))) return 'ds-color';
  if(k==='type'||(k==='tok'&&v.startsWith('font.'))) return 'ds-type';
  if(k==='tok'&&v.startsWith('spacing.')) return 'ds-space';
  if(k==='tok') return 'ds-shape';
  return {color:'ds-color',type:'ds-type',space:'ds-space',shape:'ds-shape',rules:'ds-rules'}[v]||'ds-top';
};
function openDs(sel){
  if(!isDS()){state.page='ds';state.sel=null;renderPages();renderLeft();renderToolbar();renderCanvas();}
  dsSelect(sel||'',DS_ANCHOR(sel));
}
function dsSelect(sel,anchor){
  state.dsSel=sel||null;
  renderLeft(); renderRight(); markDsOn();
  if(anchor){const el=document.getElementById(anchor); if(el) el.scrollIntoView({behavior:'smooth',block:'start'});}
}
function markDsOn(){document.querySelectorAll('#dsdoc [data-dsel]').forEach(e=>e.classList.toggle('ds-on',!!state.dsSel&&e.dataset.dsel===state.dsSel));}

/* 사용처 계산 — 시스템 값을 바꾸면 어디가 바뀌는지 */
const nodeTokVals=x=>[x.fill,x.stroke,x.strokeTop,x.radius,x.size,x.color,x.layout&&x.layout.gap,...(x.layout&&x.layout.pad?[].concat(x.layout.pad):[])];
function tokUsers(k){return Object.values(state.index).filter(({node:n})=>nodeTokVals(n).includes(k)||(n.type==='text'&&!n.color&&k==='color.text')||(n.type==='text'&&!n.size&&k==='font.md')||(n.type==='instance'&&COMPONENTS[n.of]&&COMPONENTS[n.of].tokens.includes(k)));}
const compUsers=k=>Object.values(state.index).filter(e=>e.node.type==='instance'&&e.node.of===k);
const typeUsers=t=>Object.values(state.index).filter(({node:n})=>n.type==='text'&&(n.size||'font.md')===t.size);
function usersList(es){
  if(!es.length) return '<div class="empty">아직 쓰는 곳이 없습니다.</div>';
  return `<div class="list-mini">${es.slice(0,6).map(e=>`<div data-sel="${e.node.id}" style="cursor:pointer"><span style="color:var(--text-3);width:12px;text-align:center">${TYPE_IC[e.node.type]}</span>${esc(e.node.name)}<code class="mono">${esc(e.page.name)}</code></div>`).join('')}${es.length>6?`<div style="color:var(--text-2)">외 ${es.length-6}개</div>`:''}</div>`;
}

/* 견본 렌더 (변형 × 상태) */
function demoHtml(k,row,col){
  const dis=col==='비활성', press=col==='눌림';
  if(k==='button'){const b=`<div class="c-btn v-${row}${press?' is-press':''}${dis?' is-dis':''}">${{primary:'장바구니 담기',ghost:'찜하기',inverse:'보러 가기'}[row]}</div>`;
    return row==='inverse'?`<div style="background:var(--t-color-primary);padding:8px;border-radius:var(--t-radius-lg)" title="inverse는 color.primary 면 위에서 씀">${b}</div>`:b;}
  if(k==='input'){
    const st={기본:'',포커스:'is-focus',오류:'is-err',비활성:'is-dis'}[col];
    const val=col==='포커스'?'me@exam<i class="caret"></i>':col==='오류'?'me@':'<span class="ph-t">name@example.com</span>';
    return `<div class="c-input ${st}"><span class="lb">이메일</span><span class="bx">${val}</span>${col==='오류'?'<span class="hp">이메일 형식이 아닙니다</span>':''}</div>`;
  }
  if(k==='badge') return `<span class="c-badge t-${row}">${{neutral:'품절',primary:'NEW',success:'배송 완료',danger:'재고 1개'}[row]}</span>`;
  if(k==='card') return `<div class="c-box e-${row}"><b>주문 요약</b><span>상품 금액 137,000원 · 배송비 무료</span></div>`;
  const samp={'nav-bar':{title:'장바구니',back:true},'product-card':{title:'북유럽 스탠드 조명',price:'89,000원',tone:'lamp'},'cart-item':{title:'린넨 쿠션 커버',price:'24,000원',qty:2,tone:'linen'}}[k];
  return samp?renderComponent(k,samp,state.platform).outerHTML:'';
}

function dsOutline(){
  const it=(sel,label)=>`<button class="${(state.dsSel||'')===sel?'on':''}" data-dsel="${sel}" data-anchor="${DS_ANCHOR(sel)}">${label}</button>`;
  const cs=kind=>Object.entries(COMPONENTS).filter(([,c])=>c.kind===kind).map(([k,c])=>it('comp:'+k,`<span style="color:var(--accent)">◇</span>${c.name}`)).join('');
  return `<div class="ds-out">${it('','개요 · 원칙')}
    <div class="tok-g">기초 (Foundations)</div>${it('sec:color','색')}${it('sec:type','글자')}${it('sec:space','간격')}${it('sec:shape','모서리 · 그림자')}
    <div class="tok-g">기본 컴포넌트</div>${cs('base')}
    <div class="tok-g">서비스 컴포넌트</div>${cs('service')}
    <div class="tok-g">규칙</div>${it('sec:rules','AI 규칙')}</div>

}

  h+=`<section class="ds-sec" id="ds-shape"><h3>모서리 · 그림자</h3><p class="sub">모서리는 요소 크기에 따라 세 단계, 그림자는 «떠 있는 정도»에 따라 두 단계.</p>

    <h5>기본 컴포넌트</h5>${Object.keys(COMPONENTS).filter(k=>COMPONENTS[k].kind==='base').map(comp).join('')}
    <h5>서비스 컴포넌트</h5>${Object.keys(COMPONENTS).filter(k=>COMPONENTS[k].kind==='service').map(comp).join('')}</section>`;
  h+=`<section class="ds-sec" id="ds-rules"><h3>AI 규칙</h3>

      <div class="ds-rule"><span class="no">3</span><span>글자는 글자 스타일로<small>크기·굵기·줄 높이 조합이 다섯 스타일 중 어느 것과도 맞지 않으면 가장 가까운 스타일을 제안한다.</small></span><span class="chip">항상 경고</span></div>
      <div class="ds-rule"><span class="no">4</span><span>있는 컴포넌트는 인스턴스로<small>버튼·입력창·카드처럼 생긴 프레임을 새로 그리면 «Button 인스턴스로 바꾸기»를 제안한다(lint).</small></span><span class="chip">항상 경고</span></div>
      <div class="ds-rule"><span class="no">5</span><span>컴포넌트별 규칙<small>각 컴포넌트의 쓸 때 / 피할 때 / 접근성 문장은 get_design_system 응답에 그대로 들어간다(예: primary 버튼은 화면당 1개).</small></span><span class="chip">AI가 읽음</span></div>
    </div>
    <div style="margin-top:12px"><button class="btn small primary" data-act="ds-ai">✦ AI가 읽는 형태 보기</button></div></section>`;
  h+='</div>';
  box.innerHTML=h; box.scrollTop=top; markDsOn();
}

function dsTokPanel(k){
  const group=k.split('.')[0], color=group==='color', m=SEM[k], users=tokUsers(k);
  let h=`<div class="rp-h">${color?`<span class="ic" style="background:${TOKENS[k]}"></span>`:`<span class="ic">◆</span>`}<b class="mono" style="flex:1">${k}</b><span class="ty">의미 토큰</span></div>`;
  if(color){
    h+=`<div class="rs"><h4>값</h4>
      <div class="row2"><span class="l">참조</span><div class="fld" style="flex:1"><select data-dsedit="ref:${k}">${Object.keys(PRIM).map(p=>`<option ${p===m.ref?'selected':''}>${p}</option>`).join('')}</select></div></div>
      <div class="row2"><span class="l">계산값</span><span class="tchip raw"><i style="background:${TOKENS[k]}"></i>${TOKENS[k]}</span></div>
      <div class="empty" style="font-size:11px">의미 토큰은 값을 직접 갖지 않고 기초값을 가리킵니다. 같은 색을 다른 용도로 쓰려면 새 의미 토큰을 만드세요.</div></div>
      <div class="rs"><h4>용도 <span class="chip">AI가 읽음</span></h4><textarea class="inp" data-dsedit="use:${k}">${esc(m.use)}</textarea>
      <h4>피할 곳</h4><textarea class="inp" data-dsedit="avoid:${k}" placeholder="이 토큰을 쓰면 안 되는 곳">${esc(m.avoid)}</textarea></div>`;
  } else {
    const num=typeof TOKENS[k]==='number';
    h+=`<div class="rs"><h4>값</h4>${num?`<div class="fld"><input type="number" value="${TOKENS[k]}" data-dsedit="val:${k}" aria-label="값"><span class="u">${state.data.units}</span></div>`:`<code class="mono" style="font-size:11px">${esc(TOKENS[k])}</code>`}
      ${group==='spacing'?'<div class="empty" style="font-size:11px">4의 배수를 지키세요. 단계를 바꾸면 이 간격을 쓰는 모든 레이아웃이 바뀝니다.</div>':''}</div>
      <div class="rs"><h4>용도 <span class="chip">AI가 읽음</span></h4><textarea class="inp" data-dsedit="use:${k}">${esc(TOKUSE[k]||'')}</textarea></div>`;
  }
  h+=`<div class="rs"><h4>사용처 <span>${users.length}곳</span></h4>${usersList(users)}</div>`;
  const name=k.slice(group.length+1);
  const file={color:'color',spacing:'spacing',radius:'radius',font:'typography',shadow:'shadow'}[group];
  const ent=color?{$type:'color',$value:`{${m.ref}}`,$description:m.use,...(m.avoid?{$extensions:{freegma:{avoid:m.avoid}}}:{})}
    :{$type:group==='shadow'?'shadow':'dimension',$value:typeof TOKENS[k]==='number'?dimVal(TOKENS[k]):TOKENS[k],$description:TOKUSE[k]||''};
  return h+jsonBlock(`freegma/system/tokens/${file}.tokens.json`,{[group==='font'?'fontSize':group]:{[name]:ent}});
}

/* ---------- 디자인 시스템 편집 → 데이터 반영 + 변경 기록 ---------- */
function applyDsEdit(de,v){
  const i=de.indexOf(':'), op=i<0?de:de.slice(0,i), k=i<0?'':de.slice(i+1);
  const T=TYPE.find(t=>t.id===k), C=COMPONENTS[k];
  switch(op){
    case 'brand':{const from=DS.brand; DS.brand=v.toUpperCase(); Object.assign(PRIM,brandScale(DS.brand)); syncTokens(); return {label:'brand (브랜드 색)',from,to:DS.brand,sel:''};}
    case 'font':{const from=DS.font; DS.font=v; document.documentElement.style.setProperty('--ds-font',v==='시스템 서체'?'-apple-system':`"${v}"`); return {label:'font.family',from,to:v,sel:''};}
    case 'ref':{const from=SEM[k].ref; SEM[k].ref=v; syncTokens(); return {label:k,from,to:v,sel:'tok:'+k};}
    case 'prim':{const from=PRIM[k]; PRIM[k]=v.toUpperCase(); syncTokens(); return {label:k,from,to:PRIM[k],sel:'prim:'+k};}
    case 'val':{const from=TOKENS[k]; TOKENS[k]=Math.max(0,+v||0); return {label:k,from,to:TOKENS[k],sel:'tok:'+k};}
    case 'use': case 'avoid':{
      if(SEM[k]){const from=SEM[k][op]; SEM[k][op]=v; return {label:`${k} 설명`,from,to:v,text:true,sel:'tok:'+k};}
      const from=TOKUSE[k]; TOKUSE[k]=v; return {label:`${k} 설명`,from,to:v,text:true,sel:'tok:'+k};}
    case 'tsize':{const from=T.size; T.size=v; return {label:`type.${k} 크기`,from,to:v,sel:'type:'+k};}
    case 'tweight':{const from=T.weight; T.weight=+v; return {label:`type.${k} 굵기`,from,to:+v,sel:'type:'+k};}
    case 'tlh':{const from=T.lh; T.lh=+v||T.lh; return {label:`type.${k} 줄 높이`,from,to:T.lh,sel:'type:'+k};}
    case 'tuse':{const from=T.use; T.use=v; return {label:`type.${k} 설명`,from,to:v,text:true,sel:'type:'+k};}
    case 'cuse': case 'cavoid': case 'ca11y':{const f={cuse:'use',cavoid:'avoid',ca11y:'a11y'}[op]; const from=C[f]; C[f]=v; return {label:`${k} 사용 규칙`,from,to:v,text:true,sel:'comp:'+k};}
  }
  return null;
}
function markDs(r){
