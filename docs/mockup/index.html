function dsSummary(){
  const L=[], pad=(s,n)=>s+' '.repeat(Math.max(1,n-s.length));
  L.push(`# get_design_system → ${DS.name} v${DS.version}`);
  L.push(`platform: ${state.data.platform}   units: ${state.data.units}   font: ${DS.font}`);
  L.push('');
  L.push('rules:');
  L.push(`  rawValues: ${DS.strict}   # 토큰 밖 원시값 → ${DS.strict==='warn'?'경고 후 반영':'거절'}`);
  DS.principles.forEach(p=>L.push('  - '+p));
  L.push('  - 기초값(brand.*, gray.* …)은 노드에 쓰지 않는다 → 의미 토큰');
  L.push('');
  L.push('color:   # 이름 = 참조 (값)  # 용도 | 피할 곳');
  for(const [k,m] of Object.entries(SEM)) L.push(`  ${pad(k,17)}= ${pad(m.ref,10)}(${TOKENS[k]})  # ${m.use}${m.avoid?' | 피하기: '+m.avoid:''}`);
  L.push('spacing: '+Object.keys(TOKENS).filter(k=>k.startsWith('spacing.')).map(k=>`${k.slice(8)}=${TOKENS[k]}`).join(' ')+'   # 4의 배수, gap·padding에만');
  L.push('radius:  '+['sm','md','lg'].map(x=>`${x}=${TOKENS['radius.'+x]}`).join(' ')+'   # sm 작은 요소 · md 버튼·입력 · lg 카드');
  L.push('shadow:  sm md   # md = 떠 있는 카드·시트');
  L.push('type:    # 스타일 = 크기/굵기/줄높이  # 용도');
  TYPE.forEach(t=>L.push(`  ${pad(t.id,8)}= ${t.size}(${TOKENS[t.size]})/${t.weight}/${t.lh}  # ${t.use}`));
  L.push('');
  L.push('components:   # * = 필수');
  for(const [k,c] of Object.entries(COMPONENTS)){
    L.push(`  ${k}  (${c.kind==='base'?'기본':'서비스'})  ${c.props.map(p=>p[0]+(p[2]==='필수'?'*':'')+(p[1].includes('|')?'['+p[1].replace(/ /g,'')+']':'')+(p[2]&&p[2]!=='필수'?'='+p[2]:'')).join(', ')}`);
    L.push(`    use:   ${c.use}`); L.push(`    avoid: ${c.avoid}`); if(c.a11y) L.push(`    a11y:  ${c.a11y}`);
  }
  return L.join('\n');
}

  }
  if(c.kind==='node'){
    const n=c.node; tools.unshift('get_selection');
    if(n.type==='instance'&&n.of==='button'){
      if(n.props.variant==='primary') return {tools,html:'이미 primary 버튼이에요.'};
      const others=prim.filter(e=>e.node.id!==n.id);
      if(others.length) return {tools:[...tools,'get_components(button)'],html:`바꾸지 않았어요. 디자인 시스템 규칙상 <b>primary는 화면당 1개</b>인데, 이 화면에 이미 «${esc(others[0].node.name)}»가 primary입니다. 이 버튼을 강조하려면 그 버튼을 ghost로 바꾸라고 말씀해 주세요.`};
      const from=n.props.variant;
      return {tools:[...tools,'update_nodes ✓ 검사 통과'],edits:1,target:n.id,html:`variant를 <span class="mono">${from} → primary</span>로 바꿨어요.`,
        apply:()=>{n.props.variant='primary';markEdit(n.id,'컴포넌트 속성');},undo:()=>{n.props.variant=from;}};
    }
    if(n.type==='frame'&&n.layout){
      const steps=Object.keys(TOKENS).filter(k=>k.startsWith('spacing.')), from=n.layout.gap||'spacing.1';
      const to=steps[Math.min(steps.length-1,steps.indexOf(from)+(/좁|줄/.test(text)?-1:1))]||steps[0];
      return {tools:[...tools,'update_nodes ✓ 검사 통과'],edits:1,target:n.id,html:`간격을 <span class="mono">${from} (${TOKENS[from]}) → ${to} (${TOKENS[to]})</span>로 바꿨어요. 단계 밖 값(예: 22)은 쓰지 않았습니다.`,
        apply:()=>{n.layout.gap=to;markEdit(n.id,'간격');},undo:()=>{n.layout.gap=from;}};
    }
    if(n.type==='text'){
      const order=['caption','body','title','heading','display'], cur=TYPE.find(t=>t.size===(n.size||'font.md'))||TYPE[3];
      const nx=TYPE.find(t=>t.id===order[Math.min(4,order.indexOf(cur.id)+1)]);
      if(/스타일/.test(text)) return {tools,html:`글자 스타일 <b>${cur.name}</b>(${cur.size} · ${cur.weight} · ${cur.lh})예요. 용도: ${esc(cur.use)}`};
      const fs=n.size,fw=n.weight;
      return {tools:[...tools,'update_nodes ✓ 검사 통과'],edits:1,target:n.id,html:`글자 스타일을 <b>${cur.name} → ${nx.name}</b>로 올렸어요(크기·굵기를 따로 정하지 않고 스타일 단위로).`,
        apply:()=>{n.size=nx.size;n.weight=nx.weight;markEdit(n.id,'글꼴');},undo:()=>{n.size=fs;n.weight=fw;}};
    }
  }
  return {tools:[...tools,'get_nodes','get_components'],html:`이렇게 만들 수 있어요: «주문 요약» 카드 위에 <b>Input</b>(라벨 «쿠폰 코드») + <b>Button ghost</b>(«적용»)을 가로로, 간격 <span class="mono">spacing.3</span>. primary는 이미 «주문하기»가 있어 ghost로 둡니다. <span style="color:var(--text-3)">(목업: 실제로 만들지는 않음)</span>`};

/* ---------- 도메인 (design.md §2-7) — 보드 대신 화면의 꼬리표. 라우트 첫 단어에서 자동 제안 ---------- */
const DOMAIN_SUG={'':'홈',products:'상품',product:'상품',cart:'주문',checkout:'주문',coupons:'주문',order:'주문',orders:'주문',my:'마이',mypage:'마이'};
const DOMAIN_EN={'홈':'home','상품':'products','주문':'order','마이':'my'};
const domainOf=r=>{const seg=(r||'/').split('/').filter(Boolean)[0]||''; return DOMAIN_SUG[seg]||seg||'홈';};
/* 화면들을 도메인별로 묶고 자리 잡기: 도메인 캔버스(x,y) + 전체 보기(ax,ay) */
function regroup(d){
  const all=d.pages.flatMap(p=>p.frames), mob=d.platform==='mobile', gap=mob?120:200;
  for(const f of all){ if(f.draftOf){const o=all.find(x=>x.id===f.draftOf); f.domain=o?o.domain||domainOf(o.route):f.domain;} else if(!f.domain) f.domain=f.route?domainOf(f.route):'기타'; }
  const names=[]; for(const f of all) if(!names.includes(f.domain)) names.push(f.domain);
  const order=n=>({'홈':0,'상품':1,'주문':2,'마이':3})[n]??9;
  names.sort((a,b)=>order(a)-order(b));
  let ay=0; const pages=[];
  for(const n of names){
    const base=all.filter(f=>f.domain===n&&!f.draftOf), frames=[];
    for(const f of base){frames.push(f); for(const dr of all.filter(x=>x.draftOf===f.id)) frames.push(dr);}
    for(const f of all.filter(x=>x.domain===n&&x.draftOf&&!frames.includes(x))) frames.push(f);
    let x=0; for(const f of frames){f.x=x; f.y=0; f.ax=x; f.ay=ay; x+=f.w+gap;}
    ay+=Math.max(...frames.map(f=>f.h))+(mob?380:620);
    pages.push({id:'d-'+n,name:n,frames});
  }
  d.pages=pages;
}
for(const plat of ['web','mobile']){
  const d=DATA[plat]; regroup(d);
  const pd=d.pages.find(p=>p.frames.some(f=>/-pd$/.test(f.id))); d.startPage=pd.id;
  d.changes.modified.page='상품'; d.changes.added.page='홈';
}

/* =====================================================================
   커밋 (design.md §5)

function commitMessage(items){
  if(!items.length) return '';
  const pages=new Set(items.filter(i=>!i.tok&&i.label.includes(' / ')).map(i=>i.label.split(' / ')[0]));
  const scr=items.filter(i=>!i.tok);
  const scope=scr.length===0?'system':(pages.size===1?[...pages][0]:'');
  const verb={add:'추가',mod:'수정',del:'삭제'};
  const main=scr.length?scr.filter(i=>i.k!=='del').slice(0,2).map(i=>`${i.label.split(' / ')[1]} ${verb[i.k]}`):[items.slice(0,2).map(i=>i.label).join(', ')+' 변경'];
  if(scr.length&&main.length===1&&items.some(i=>i.tok)) main.push('디자인 시스템 변경');
  const rest=scr.length?items.length-main.length:Math.max(0,items.length-2);
  let first=`design${scope?`(${scope})`:''}: ${main.join(', ')||'디자인 시스템 변경'}${rest>0?` 외 ${rest}건`:''}`;
  const groups=['추가','수정','삭제','디자인 시스템'];
  let body=groups.map(g=>{const xs=items.filter(i=>i.group===g); if(!xs.length) return '';
    return g+'\n'+xs.map(i=>`- ${i.label}${i.detail?(i.tok?': ':': ')+i.detail:''}`).join('\n');}).filter(Boolean).join('\n');
  return first+'\n\n'+body;
}

      ${noAuthor?`<div class="fl"><label>작성자 — 이 저장소에 git 작성자 정보가 없습니다</label><div class="inline"><input class="inp" id="cm-name" placeholder="이름"><input class="inp" id="cm-mail" placeholder="이메일"></div><div class="author">이 저장소 설정(<span class="mono">git config --local</span>)에만 저장합니다. 처음 한 번만 묻습니다.</div></div>`

      <div id="cm-err"></div>
    </div>
    <div class="modal-f"><span class="sp">freegma/ 만 커밋합니다. 서비스 코드는 포함되지 않습니다.</span><button class="btn" data-close="1">취소</button><button class="btn primary" id="cm-ok">커밋</button></div>
  </div></div>`;
  document.querySelectorAll('[data-chg]').forEach(b=>b.onclick=()=>{
    const it=items[+b.dataset.chg]; closeModal();
    if(it.tok){openDs(it.ds);return;}
    select(it.target); const e=elOf(it.target); if(e){const r=relRect(e),c=$('#canvas').getBoundingClientRect();
      state.view.x+=c.width/2-(r.x+r.w/2); state.view.y+=c.height/2-(r.y+r.h/2); applyView();}
  });
  $('#cm-ok').onclick=()=>{
    const btn=$('#cm-ok');
    if(noAuthor&&(!$('#cm-name').value||!$('#cm-mail').value)){$('#cm-err').innerHTML='<pre class="err">이름과 이메일을 입력해 주세요.</pre>';return;}
    btn.disabled=true; btn.textContent='커밋 중…';
    setTimeout(()=>{
      if($('#fl-hook').checked){
        btn.disabled=false; btn.textContent='다시 시도';
        $('#cm-err').innerHTML=`<pre class="err mono">$ git commit -F - -- freegma/
pre-commit 훅 실패 (exit 1)
&gt; lint-design
✖ freegma/system/tokens/color.tokens.json
  사용하지 않는 토큰: color.legacy-blue</pre>`;
        return;
      }
      const hash=Math.random().toString(16).slice(2,9);
      const first=$('#cm-msg').value.split('\n')[0];
      if(noAuthor){$('#fl-author').checked=false;}
      state.baseChanges=false; state.edits.clear(); state.dsEdits.clear(); state.added=[]; closeModal(); renderHeaderGit();
      toast(`커밋됨 · ${hash} · ${first}`);
    },600);
  };
}
function openConflict(){
  $('#layer-modal').innerHTML=`<div class="scrim" data-close="1"><div class="modal" role="dialog" aria-label="충돌 해결">
    <div class="modal-h">⚠ 충돌 해결 필요</div>
    <div class="modal-b"><div class="empty" style="font-size:12px;color:var(--text-2)">브랜치를 합치다가 같은 화면을 양쪽에서 고쳤습니다. 파일마다 하나를 고르세요.</div>
      <div class="folder-card"><div class="path mono" style="font-size:12px">freegma/pages/product-detail/info-card.fg.json</div><div class="row2" style="color:var(--text-2)">상품 상세 / 정보 카드</div>
      <div class="btnrow"><button class="btn small" data-res="mine">내 것</button><button class="btn small" data-res="theirs">상대 것</button><button class="btn small primary" data-res="both">둘 다 나란히</button></div></div>
    </div>
    <div class="modal-f"><span class="sp">«둘 다 나란히»는 두 버전을 프레임 두 개로 놓고 비교하게 합니다.</span><button class="btn" data-close="1">나중에</button></div>
  </div></div>`;
  document.querySelectorAll('[data-res]').forEach(b=>b.onclick=()=>{$('#fl-conflict').checked=false;closeModal();renderHeaderGit();toast({mine:'내 것으로 해결했습니다',theirs:'상대 것으로 해결했습니다',both:'두 버전을 나란히 놓았습니다 — 비교 후 하나를 지우세요'}[b.dataset.res]);});
}
function closeModal(){$('#layer-modal').innerHTML='';}

/* =====================================================================
   미리보기 (프로토타입)
   ===================================================================== */
function openPreview(){
  const d=state.data, mob=d.platform==='mobile';
  const win=$('#win').getBoundingClientRect();
  const availH=win.height-110, availW=win.width-80;
  const W=mob?393:1440, H=mob?852:960;
  const s=Math.min((availH-(mob?24:34))/H,(availW-(mob?24:0))/W,1);
  const vw=Math.round(W*s), vh=Math.round(H*s);
  const history=[d.startFrame];
  $('#layer-modal').innerHTML=`<div class="pv-scrim"><div class="pv-top"><b>미리보기</b><span id="pv-name" style="color:#bbb"></span><span class="sp"></span><span>클릭할 수 있는 곳을 모르면 아무 곳이나 누르세요 · Esc 닫기</span><button class="btn small" data-close="1">닫기</button></div>
    <div class="pv-body">${mob
      ?`<div class="dev-phone"><div class="scr"><div class="island"></div><div class="pv-viewport dz" id="pv-vp" style="width:${vw}px;height:${vh}px;${tokenStyleVars()}"></div></div></div>`
      :`<div class="dev-web"><div class="bar"><div class="lights"><i></i><i></i><i></i></div><div class="url" id="pv-url"></div></div><div class="pv-viewport dz" id="pv-vp" style="width:${vw}px;height:${vh}px;${tokenStyleVars()}"></div></div>`}
    </div></div>`;
  const vp=$('#pv-vp');
  const show=(fid,anim)=>{
    const f=state.index[fid].node;
    const sc=document.createElement('div'); sc.className='pv-screen '+(anim||''); sc.style.setProperty('--s',s); sc.style.transform=`scale(${s})`;
    const el=renderNode(f,'col',d.platform); el.style.width=f.w+'px'; el.style.height=f.h+'px'; el.style.overflow='hidden';
    sc.appendChild(el);
    const old=[...vp.children]; vp.appendChild(sc); setTimeout(()=>old.forEach(o=>o.remove()),anim?300:0);
    $('#pv-name').textContent=f.name;
    const url=$('#pv-url'); if(url) url.textContent='localhost:5173/'+(f.k||'').replace(/Page$/,'').replace(/([a-z])([A-Z])/g,'$1-$2').toLowerCase();
  };
  show(d.startFrame);
  vp.onclick=e=>{
    let t=e.target.closest('[data-id]');
    while(t&&!d.interactions[t.dataset.id]) t=t.parentElement&&t.parentElement.closest('[data-id]');
    if(!t){ const cur=vp.lastElementChild; const ids=Object.keys(d.interactions);
      cur.querySelectorAll('[data-id]').forEach(x=>{if(ids.includes(x.dataset.id)){x.classList.add('hot');setTimeout(()=>x.classList.remove('hot'),500);}}); return; }
    const ix=d.interactions[t.dataset.id];
    if(ix.action==='뒤로'){ if(history.length>1){history.pop();} else history[0]=ix.to; show(history[history.length-1],mob?'in-back':'in-fade'); }
    else { history.push(ix.to); show(ix.to,mob?'in-push':'in-fade'); }
  };
}

/* =====================================================================
   팝오버
   ===================================================================== */
function closePop(){document.querySelectorAll('.pop').forEach(p=>p.remove());}
function openPop(anchor,html,{up}={}){
  closePop();
  const w=$('#win').getBoundingClientRect(), a=anchor.getBoundingClientRect();
  const p=document.createElement('div'); p.className='pop'; p.innerHTML=html;
  $('#win').appendChild(p);
  const left=Math.min(a.left-w.left,w.width-p.offsetWidth-10);
  p.style.left=left+'px';
  if(up) p.style.bottom=(w.bottom-a.top+6)+'px'; else p.style.top=(a.bottom-w.top+6)+'px';
  return p;
}

/* =====================================================================
   이벤트
   ===================================================================== */
function markEdit(nodeId,kind){
  const fid=state.index[nodeId].frame.id, fr=state.index[fid].node;
  if(fr.code&&fr.code.synced){const t=(nodeId===fid?'':state.index[nodeId].node.name+': ')+kind; if(!fr.code.since.includes(t)) fr.code.since.push(t); if(!fr.code.stale){fr.code.stale=true; setTimeout(()=>{renderCanvas();renderPages();renderLeft();},0);}}
  if(!state.edits.has(fid)) state.edits.set(fid,new Set());
  state.edits.get(fid).add(kind);
  renderHeaderGit();
  $('#sb-save').textContent='저장 중…'; setTimeout(()=>$('#sb-save').textContent='저장됨',350);
}
document.addEventListener('click',e=>{
  const t=e.target;
  const cl=t.closest('[data-close]');
  if(cl&&(cl===t||cl.tagName==='BUTTON')){closeModal();return;}
  if(!t.closest('.pop')&&!t.closest('[data-act="mcp"]')&&!t.closest('[data-tool="frame"]')) closePop();

  const go=t.closest('[data-go]');
  if(go){const g=go.dataset.go;
    if(g==='start'){closeModal();state.startStep=null;renderStart();showScreen('start');}
    else if(g==='create'){state.startStep=null;renderStart();showScreen('start');openCreate(false);}
    else if(g==='web'||g==='mobile'){openEditor(g);}
    else if(g==='ds'){openEditor(state.data?state.platform:'web',state.data?state.project:null,{ds:true});}
    else if(g==='commit'){if(state.screen!=='editor'||!state.data) openEditor('web'); setTimeout(openCommit,50);}
    return;
  }
  const act=t.closest('[data-act]');
  if(act){const a=act.dataset.act;
    if(a==='open-folder'){state.startStep='nogit';renderStart();}
    else if(a==='git-init'){state.startStep='nodesign';renderStart();toast('git init 완료 · ~/work/new-app');}
    else if(a==='open-anyway'){openCreate(true);}
    else if(a==='new-project'){openCreate(false);}
    else if(a==='recent'){openEditor(act.dataset.p,act.dataset.n);}
    else if(a==='commit'){openCommit();}
    else if(a==='mcp'&&!claudeOn()){openPop(act,`<div class="ph">MCP</div><div class="pbody"><div><span style="color:var(--text-3)">●</span> AI 연결 안 됨</div><div style="color:var(--text-2)">Claude Code 설치·로그인 후 한 번 등록:</div><code class="cmd mono">claude mcp add freegma -- freegma mcp --project ./freegma</code><button class="btn small" data-act="copy-mcp">명령 복사</button></div>`,{up:true});}
    else if(a==='mcp-help'){toast('Claude Code 설치·로그인 → claude mcp add freegma -- freegma mcp --project ./freegma');}
    else if(a==='ds-reimport'){if(!claudeOn()){toast('Claude Code 연결이 필요합니다 — 상태줄 «AI 연결 안 됨»을 눌러 보세요');} else openClaudeImport({plat:state.platform,reimport:true,brand:DS.brand});}
    else if(a==='mcp'){openPop(act,`<div class="ph">MCP</div><div class="pbody"><div><span style="color:var(--ok)">●</span> Claude Code 연결됨 · 요청 12회</div><button class="btn small" data-rtab="ai">✦ AI 탭 열기 · ⌘L</button><div style="color:var(--text-2)">AI 도구에 한 번 등록:</div><code class="cmd mono">claude mcp add freegma -- freegma mcp --project ./freegma</code><button class="btn small" data-act="copy-mcp">명령 복사</button></div>`,{up:true});}
    else if(a==='copy-mcp'){navigator.clipboard&&navigator.clipboard.writeText('claude mcp add freegma -- freegma mcp --project ./freegma').catch(()=>{});toast('명령을 복사했습니다');closePop();}
    else if(a==='share'){state.share=!state.share;renderStatus();toast(state.share?'선택 공유 켜짐 — AI가 get_selection으로 지금 선택을 읽을 수 있습니다':'선택 공유 꺼짐');}
    else if(a==='ai-flash'){const id=state.data.ai[0];select(id);state.aiFlash=true;updateOverlay();setTimeout(()=>{state.aiFlash=false;updateOverlay();},2600);}
    else if(a==='zoom-in'){const c=$('#canvas').getBoundingClientRect();zoomAt(1.25,c.width/2,c.height/2);}
    else if(a==='zoom-out'){const c=$('#canvas').getBoundingClientRect();zoomAt(.8,c.width/2,c.height/2);}
    else if(a==='fit'){fit();}
    else if(a==='preview'){openPreview();}
    else if(a==='copy'){navigator.clipboard&&navigator.clipboard.writeText(lastCode).catch(()=>{});toast('코드를 복사했습니다');}
    else if(a==='ask-ai'){const n=state.index[state.sel].node;navigator.clipboard&&navigator.clipboard.writeText(`freegma의 «${n.name}»(${n.id})을 ${state.data.spec} 코드로 반영해줘. MCP generate_code로 코드를 받아 기존 컴포넌트에 맞춰 넣어줘.`).catch(()=>{});toast('AI에게 넘길 요청문을 복사했습니다 — Claude Code에 붙여 넣으세요');}
    else if(a==='spec'){toast('설정 › 개발 스펙 (freegma/spec.json) 으로 이동 — 목업');}
    else if(a==='todo'){closePop();toast('목업에서는 동작하지 않습니다');}
    else if(a==='ds-ai'){openDsAi();}
    else if(a==='branch'){openBranchMenu(act);}
    else if(a==='new-screen'){openNewScreen();}
    else if(a==='make-draft'){makeDraft(act.dataset.fid);}
    else if(a==='handoff'){openHandoff(act.dataset.fid);}
    else if(a==='run-handoff'){runHandoff(act.dataset.fid);}
    else if(a==='copy-handoff'){navigator.clipboard&&navigator.clipboard.writeText(handoffPrompt(state.index[act.dataset.fid].node)).catch(()=>{});toast('요청문을 복사했습니다 — 터미널의 Claude Code에 붙여 넣으세요');}
    else if(a==='branch-new'){openBranchNew();}
    else if(a==='copy-ds'){navigator.clipboard&&navigator.clipboard.writeText(dsSummary()).catch(()=>{});toast('get_design_system 응답을 복사했습니다');}
    return;
  }
  const pg=t.closest('[data-page]');
  if(pg){state.page=pg.dataset.page;state.sel=null;state.dsSel=null;renderPages();renderLeft();renderToolbar();renderCanvas();renderRight();if(!isDS())requestAnimationFrame(fit);return;}
  const dsl=t.closest('[data-dsel]');
  if(dsl){dsSelect(dsl.dataset.dsel,dsl.dataset.anchor||(dsl.closest('#right')?DS_ANCHOR(dsl.dataset.dsel):null));return;}
  const stv=t.closest('[data-strict]');
  if(stv){setStrict(stv.dataset.strict);return;}
  const gs=t.closest('[data-goscreen]'); if(gs){goScreen(gs.dataset.goscreen);return;}
  const rl=t.closest('[data-role]'); if(rl&&state.sel){setRole(state.sel,rl.dataset.role);return;}
  const bb=t.closest('[data-branch]'); if(bb){if(!bb.disabled) confirmSwitch(bb.dataset.branch); return;}
  const rt=t.closest('[data-rtab]'); if(rt){closePop();state.rtab=rt.dataset.rtab;renderRight();if(state.rtab==='ai'){const i=$('#ai-in');if(i)i.focus();}return;}
  const sg=t.closest('[data-ai-sug]'); if(sg){aiSend(sg.dataset.aiSug);return;}
  const as=t.closest('[data-ai-show]'); if(as){const m=state.chat[+as.dataset.aiShow]; select(m.target); flashIds([m.target]); return;}
  const au=t.closest('[data-ai-undo]'); if(au){const m=state.chat[+au.dataset.aiUndo]; m.undo(); m.reverted=true; renderCanvas(); if(isDS()) renderDsDoc(); renderRight(); toast('AI 답변 하나를 되돌렸습니다 (되돌리기 한 단위)'); return;}
  const lt=t.closest('[data-ltab]'); if(lt){state.ltab=lt.dataset.ltab;renderLeft();return;}
  const md=t.closest('[data-mode]'); if(md){state.mode=md.dataset.mode;document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.mode===state.mode));renderToolbar();renderRight();updateOverlay();return;}
  const tl=t.closest('[data-tool]');
  if(tl){state.tool=tl.dataset.tool;renderToolbar();
    if(state.tool==='frame'){openPop($('[data-tool="frame"]'),`<div class="ph">프레임 프리셋 · ${state.platform==='web'?'웹':'모바일 앱'}</div>${state.data.presets.map(p=>`<button class="pi" data-act="todo">${p[0]}<span class="kbd">${p[1]}×${p[2]}</span></button>`).join('')}<div class="br-sep"></div><button class="pi" data-act="new-screen">+ 새 화면…<span class="kbd">라우트 지정</span></button>`);}
    return;}
  const tw=t.closest('[data-tw]'); if(tw&&tw.dataset.tw){const id=tw.dataset.tw;state.collapsed.has(id)?state.collapsed.delete(id):state.collapsed.add(id);renderLeft();return;}
  const ls=t.closest('[data-sel]'); if(ls){select(ls.dataset.sel,{reveal:false});return;}
  const fl=t.closest('[data-selframe]'); if(fl){select(fl.dataset.selframe);return;}
});
// 오른쪽 패널 편집 (인스턴스 props · 텍스트 · 이름)
document.addEventListener('input',e=>{
  if(e.target.id==='ai-in'){state.chatDraft=e.target.value;return;}
  const ed=e.target.dataset&&e.target.dataset.edit; if(!ed||!state.sel) return;
  const n=state.index[state.sel].node;
  if(ed==='name'){n.name=e.target.value; if(state.ltab==='layers'){const r=document.querySelector(`.layers .row[data-sel="${CSS.escape(n.id)}"] .nm`); if(r) r.textContent=n.name;}}
  else if(ed==='text'){n.text=e.target.value; renderCanvas();}
  else if(ed.startsWith('prop:')){n.props[ed.slice(5)]=e.target.value; renderCanvas();}
});
document.addEventListener('change',e=>{
  const ed=e.target.dataset&&e.target.dataset.edit; if(!ed||!state.sel) return;
  markEdit(state.sel,ed==='name'?'이름':ed==='text'?'텍스트':'컴포넌트 속성');
  if(ed==='name') renderCanvas();
  if(ed.startsWith('prop:')) renderRight();
});

/* 캔버스: 선택·호버·이동·확대 */
const canvas=$('#canvas');
let space=false, drag=null;
canvas.addEventListener('mousemove',e=>{
  if(drag){state.view.x=drag.vx+e.clientX-drag.x;state.view.y=drag.vy+e.clientY-drag.y;applyView();return;}
  const n=e.target.closest&&e.target.closest('#world [data-id]');
  const id=n?n.dataset.id:null;
  if(id!==state.hover){state.hover=id;updateOverlay();}
});
canvas.addEventListener('mouseleave',()=>{state.hover=null;updateOverlay();});
canvas.addEventListener('mousedown',e=>{
  if(space||e.button===1){drag={x:e.clientX,y:e.clientY,vx:state.view.x,vy:state.view.y};canvas.classList.add('panning');e.preventDefault();return;}
  if(e.target.closest('[data-selframe]')) return;
  if(state.tool!=='move'){toast('목업에서는 그리기가 동작하지 않습니다');state.tool='move';renderToolbar();return;}
  const n=e.target.closest('#world [data-id]');
  select(n?n.dataset.id:null);
});
window.addEventListener('mouseup',()=>{if(drag){drag=null;canvas.classList.remove('panning');}});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const c=canvas.getBoundingClientRect();
  if(e.ctrlKey||e.metaKey) zoomAt(Math.exp(-e.deltaY*.01),e.clientX-c.left,e.clientY-c.top);
  else{state.view.x-=e.deltaX;state.view.y-=e.deltaY;applyView();}
},{passive:false});
window.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='l'&&state.screen==='editor'&&!$('#layer-modal').innerHTML){e.preventDefault();state.rtab=state.rtab==='ai'?'props':'ai';renderRight();if(state.rtab==='ai'){const i=$('#ai-in');if(i)i.focus();}return;}
  if(e.target&&e.target.id==='ai-in'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();aiSend(e.target.value);return;}
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(e.key==='Escape'){closePop();if($('#layer-modal').innerHTML)closeModal();else if(state.screen==='editor')select(null);return;}
  if(typing||state.screen!=='editor'||$('#layer-modal').innerHTML) return;
  if(e.code==='Space'&&!space){space=true;canvas.classList.add('pan');e.preventDefault();}
  const map={v:'move',f:'frame',r:'rect',t:'text'};
  if(!e.metaKey&&!e.ctrlKey&&map[e.key]){state.tool=map[e.key];renderToolbar();}
  if(e.shiftKey&&e.key==='!'){fit();}
});
window.addEventListener('keyup',e=>{if(e.code==='Space'){space=false;canvas.classList.remove('pan');}});
window.addEventListener('resize',()=>{if(state.screen==='editor')updateOverlay();});

/* 목업 상태 토글 · 테마 */
['fl-conflict','fl-author','fl-hook'].forEach(id=>$('#'+id).addEventListener('change',()=>{if(state.data)renderHeaderGit();}));
$('#fl-claude').addEventListener('change',()=>{if(state.data){renderStatus();renderRight();}});
$('#theme').addEventListener('change',e=>{const v=e.target.value; if(v) document.documentElement.dataset.theme=v; else delete document.documentElement.dataset.theme;});

/* 시작 */
renderStart(); showScreen('start');
</script>
